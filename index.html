function todoView(){let all=data.tasks.filter(t=>!t.done&&(taskFilter==='all'||t.category===taskFilter));return `<form class="quick-form" id="quick-task"><input name="title" aria-label="Quick task title" placeholder="Add a to-do · press Enter" maxlength="160" required><select name="category" aria-label="Category"><option selected>Personal</option><option>Work</option></select></form><div class="filters task-filters">${['all','Work','Personal'].map(f=>`<button data-act="task-filter" data-filter="${f}" class="${taskFilter===f?'on':''}">${f==='all'?'All tasks':f}</button>`).join('')}</div>${[['Today',all.filter(t=>t.date&&t.date<=today),today],['Tomorrow',all.filter(t=>t.date===add(today,1)),add(today,1)],['Later',all.filter(t=>t.date>add(today,1)),add(today,2)],['No date',all.filter(t=>!t.date),'']].map(([title,list,d])=>`<section data-drop-date="${d}"><div class="section-label">${title}<small>${list.length} open</small></div>${taskList(list)}</section>`).join('')}<button class="text-btn" style="margin-top:15px" data-act="done-toggle">${showDone?'Hide':'Show'} completed (${data.tasks.filter(t=>t.done).length})</button>${showDone?taskList(data.tasks.filter(t=>t.done&&(taskFilter==='all'||t.category===taskFilter))):''}`}
function calendarView(){const first=date(month+'-01'),start=(first.getDay()+6)%7,count=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();let cells='<span></span>'.repeat(start);for(let i=1;i<=count;i++){let d=month+'-'+String(i).padStart(2,'0'),marked=data.tasks.some(t=>t.date===d&&!t.done)||data.events.some(e=>e.date===d)||data.workouts.some(w=>w.date===d);cells+=`<button class="cal-day ${d===today?'today':''} ${d===selectedDate?'selected':''}" data-act="cal-day" data-date="${d}" data-drop-date="${d}" aria-pressed="${d===selectedDate}">${i}${marked?'<i></i>':''}</button>`}let items=[...data.events.filter(e=>e.date===selectedDate).map(e=>({...e,type:'event',action:'event-edit'})),...data.tasks.filter(t=>t.date===selectedDate&&!t.done).map(t=>({...t,type:'task',action:'task-edit'})),...data.workouts.filter(w=>w.date===selectedDate).map(w=>({...w,time:w.slot,type:'workout',action:'workout-edit'}))].sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));return heading('Calendar','event-new','Event')+`<div class="calendar-layout"><div class="calendar-panel"><div class="month-head"><button data-act="month-prev" aria-label="Previous month">‹</button><span>${fmt(month+'-01',{month:'long',year:'numeric'})}</span><button data-act="month-next" aria-label="Next month">›</button></div><div class="cal-grid">${['M','T','W','T','F','S','S'].map(d=>`<span class="weekday">${d}</span>`).join('')}${cells}</div><div style="display:flex;justify-content:space-between;margin-top:12px"><button class="text-btn" data-act="cal-today">Today</button><input style="width:auto;padding:6px;font-size:11px" type="date" id="jump-date" value="${selectedDate}" aria-label="Jump to date"></div></div><div class="panel"><div class="section-label" style="margin-top:0">${fmt(selectedDate,{weekday:'long',month:'short',day:'numeric'})}<button class="text-btn" data-act="task-new" data-date="${selectedDate}">+ To-do</button></div>${items.length?items.map(e=>`<div class="agenda-item"><span>${esc(e.time function workoutsView(){let days=Array.from({length:7},(_,i)=>add(week,i)),ws=data.workouts.filter(w=>days.includes(w.date));return heading('Workouts','workout-new','Plan session')+`<div class="week-control"><button data-act="week-prev">←</button><strong>${fmt(week)} – ${fmt(add(week,6))}</strong><button data-act="week-next">→</button></div><div class="stats"><div><b>${ws.reduce((s,w)=>s+Number(w.target),0)}</b><small>Planned minutes</small></div><div><b>${ws.reduce((s,w)=>s+Number(w.actual||0),0)}</b><small>Logged minutes</small></div><div><b>${workoutScore()}%</b><small>Workout efficiency</small></div></div>${days.map(d=>`<section class="workout-day"><h3>${fmt(d,{weekday:'long',month:'short',day:'numeric'})}${d===today?' · Today':''}</h3><div class="slots">${['AM','PM'].map(slot=>`<div class="slot"><div class="slot-label">${slot}</div>${data.workouts.filter(w=>w.date===d&&w.slot===slot).map(w=>`<article class="session"><b>${esc(w.title)}</b><small>${esc(w.kind)} · ${w.target} min${w.actual!==null?' · '+Math.round(Math.min(w.actual/w.target,1)*100)+'%':''}</small><div class="actions"><button data-act="workout-edit" data-id="${w.id}">Edit plan</button><button data-act="workout-log" data-id="${w.id}">${w.actual===null?'Log session':'Edit log'}</button></div></article>`).join('')}<button class="slot-add" data-act="workout-new" data-date="${d}" data-slot="${slot}">+ Add ${slot} session</button></div>`).join('')}</div></section>`).join('')}`}

function habitsView(){const ds=Array.from({length:7},(_,i)=>add(habitWeek,i));return `<div class="stats"><div><b>${habitScore()}%</b><small>Trailing 7 days</small></div><div><b>${data.habits.filter(h=>h.days.includes(today)).length}/${data.habits.length}</b><small>Completed today</small></div></div><div class="week-control"><button data-act="habit-prev">←</button><strong>${fmt(habitWeek)} – ${fmt(add(habitWeek,6))}</strong><button data-act="habit-next">→</button></div><div class="habit-header"><span>Habit</span>${ds.map(d=>`<span>${fmt(d,{weekday:'narrow'})}<br>${date(d).getDate()}</span>`).join('')}</div>${data.habits.map(h=>`<article class="habit-row"><button class="habit-name" data-act="habit-edit" data-id="${h.id}"><b>${esc(h.title)}</b><small>${esc(h.goal)}</small></button>${ds.map(d=>`<button class="tick ${h.days.includes(d)?'on':''}" data-act="habit-tick" data-id="${h.id}" data-date="${d}" aria-label="${esc(h.title)}, ${fmt(d)}, ${h.days.includes(d)?'complete':'incomplete'}" aria-pressed="${h.days.includes(d)}">${h.days.includes(d)?'✓':'○'}</button>`).join('')}</article>`).join('')}`}
function modal(title,body,{kind='',id='',wide=false,form=true}={}){if(!$('#modal-root').children.length)focusBeforeDialog=document.activeElement;modalKind=kind;recordId=id;editorRange=null;$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="sheet ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-title"><h2>${title}</h2><button class="icon-btn" data-act="close" aria-label="Close">×</button></div>${form?'<form id="editor">':''}${body}${form?'<div class="form-actions">'+(id?`<button class="danger" type="button" data-act="delete">Delete</button>`:'')+'<button class="secondary" type="button" data-act="close">Cancel</button><button class="primary" type="submit">Save</button></div></form>':''}</section></div>`;$('#workspace').inert=true;setTimeout(()=>$('#modal-root input,#modal-root button')?.focus(),0)}

function noteEditor(id=''){let n=data.notes.find(n=>n.id===id)||{tab:noteTab,folder:noteFolder==='all'?'General':noteFolder};modal(id?'Edit note':'New note',`<label for="note-title">Title</label><input id="note-title" name="title" required maxlength="160" value="${esc(n.title||'')}"><div class="row2">${select('Notebook','tab',['Work','Personal','Spanish'],n.tab)}<div><label for="note-folder">Folder · choose or type a new one</label><input id="note-folder" name="folder" list="note-folders" value="${esc(n.folder)}" required maxlength="60"><datalist id="note-folders">${[...new Set(data.notes.map(x=>x.folder))].map(f=>`<option value="${esc(f)}">`).join('')}</datalist></div></div><label>Note content</label><div class="toolbar" role="toolbar" aria-label="Note formatting">${[['bold','B'],['italic','I'],['underline','U'],['formatBlock','Heading'],['insertUnorderedList','• List'],['insertOrderedList','1. List']].map(([c,t])=>`<button type="button" data-format="${c}">${t}</button>`).join('')}<button type="button" data-act="note-image">+ Image</button><input type="file" id="image-file" accept="image/*" hidden></div><div id="rich-body" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Note content">${clean(n.body||'')}</div><small style="display:block;margin-top:8px;font-size:10px">Paste images directly into your note. Images and formatting are saved with it.</small>`,{kind:'note',id,wide:true});}

function searchResults(q){let a=[...data.tasks.map(x=>({...x,kind:'To-do',act:'task-edit'})),...data.events.map(x=>({...x,kind:'Calendar',act:'event-edit'})),...data.workouts.map(x=>({...x,kind:'Workout',act:'workout-edit'})),...data.notes.map(x=>({...x,kind:'Note',act:'note-read'})),...data.habits.map(x=>({...x,kind:'Habit',act:'habit-edit'}))].filter(x=>(x.title+' '+plain(x.body||'')+' '+(x.notes||'')).toLowerCase().includes(q.toLowerCase()));$('#search-results').innerHTML=q?(a.length?a.map(x=>`<button class="search-result" data-act="${x.act}" data-id="${x.id}"><b>${esc(x.title)}</b><small>${x.kind}${x.date?' · '+fmt(x.date):''}</small></button>`).join(''):'<div class="empty">No matches found.</div>'):''}

addEventListener('click', async e => {

    case 'mic': listening ? stopMic() : startMic(); break;

    case 'g-import': b.disabled = true; try { await granolaImport(); } finally { b.disabled = false; } break;

    case 'folder-toggle': { const k = fKey(b.dataset.tab, b.dataset.folder); if (openFolders.has(k)) openFolders.delete(k); else { openFolders.add(k); const st = new Date().toISOString(); data.notes.filter(n => n.tab === b.dataset.tab && n.folder === b.dataset.folder).forEach(n => n.lastOpened = st); _save(); } ls.set('2b-openf', [...openFolders]); render(); break; }

    case 'phrase-review': { const p = data.notes.find(x => x.id === b.dataset.id); if (p) { recordReview(p, b.dataset.ok === '1'); forceClose(); render(); notify(b.dataset.ok === '1' ? 'Review saved. One box per day.' : 'Review saved. Keep practicing.'); } break; }
    case 'phrase-edit': { const p = data.notes.find(x => x.id === b.dataset.id); if (p) phraseEditor(p); break; }
    case 'phrase-save': { const p = data.notes.find(x => x.id === b.dataset.id); if (!p) break; const es = document.getElementById('pe-es').value.trim(); if (!es) { notify('Enter the Spanish phrase.'); break; } p.es = es; p.en = document.getElementById('pe-en').value.trim(); p.note = document.getElementById('pe-note').value.trim(); p.title = es.slice(0, 160); p.body = phraseBody(p); p.updated = new Date().toISOString(); save(); forceClose(); render(); notify('Phrase saved.'); break; }
    case 'phrase-del': { if (!confirm('Delete this phrase?')) break; data.notes = data.notes.filter(x => x.id !== b.dataset.id); save(); forceClose(); render(); notify('Deleted.'); break; }
    case 'quiz-start': forceClose(); startQuiz(); break;
    case 'quiz-answer': { const q = quiz; if (!q || q.answered) break; const p = data.notes.find(x => x.id === q.queue[0]); q.answered = true; q.picked = Number(b.dataset.i); const ok = q.options[q.picked] === p.en; recordReview(p, ok); if (ok) q.correct++; else q.missed++; renderQuiz(p); break; }
    case 'quiz-next': { const q = quiz; if (!q) break; const cur = q.queue.shift(), p = data.notes.find(x => x.id === cur); if (p && q.options[q.picked] !== p.en) q.queue.push(cur); quizQuestion(); break; }
    case 'quiz-done': forceClose(); noteTab = 'Spanish'; noteFolder = 'all'; go('notes'); break;
    case 'sync-settings': forceClose(); syncSheet(); break;
    case 's-save': {
      const url = (document.getElementById('s-url').value.match(/https:\/\/script\.google(?:usercontent)?\.com\/[^\s`'"<>]+?\/exec/) || [document.getElementById('s-url').value.trim()])[0], key = document.getElementById('s-key').value.replace(/[^A-Za-z0-9_-]/g, '');
      cfg.names = document.getElementById('s-names').value.trim(); learnNames();
      if (url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { notify('That should be the script.google.com …/exec link.'); return; }
      if (url && !key) { notify('Paste your key too: the long code after “Your 2nd Brain key:” in the Apps Script Execution log.'); document.getElementById('s-key').focus(); return; }
      if (url && !/\/exec(\?|$)/.test(url)) { notify('Use the Web app URL that ends in /exec (not /dev).'); return; }
      if (url !== cfg.url || key !== cfg.token) { cfg.since = 0; cfg.planAt = 0; hashes = null; markChanges(); Object.assign(dirty, Object.fromEntries(COLLS.flatMap(c => (data[c] || []).filter(x => syncable(c, x)).map(x => [c + '|' + x.id, { u: Date.now() }])))); }
      cfg.url = url; cfg.token = key; saveCfg(); forceClose();
      if (!url) { notify('Saved.'); break; }
      try { await api({ action: 'ping' }); notify('Connected. Syncing…'); sync(true); } catch (err) { cfg.status = 'Could not connect: ' + err.message; saveCfg(); paintStatus(); notify(cfg.status); }
      break;
    }
    case 's-plan': cfg.planAt = 0; saveCfg(); forceClose(); sync(true); break;
    case 's-strava': {
      b.disabled = true; b.textContent = 'Syncing Garmin…';
      try { const r = await api({ action: 'strava' }); cfg.strava = r.strava; cfg.planAt = 0; saveCfg(); forceClose(); notify(r.strava && r.strava.error ? 'Strava: ' + r.strava.error : `Garmin: ${r.added} new activit${r.added === 1 ? 'y' : 'ies'}.`); sync(); }
      catch (err) { notify(/unknown|action/i.test(err.message) ? 'Paste the latest Code.gs and deploy a New version first.' : 'Garmin sync: ' + err.message); b.disabled = false; b.textContent = 'Sync Garmin now'; }
      break;
    }
    case 's-off': cfg = { names: cfg.names }; saveCfg(); forceClose(); paintStatus(); notify('This device is no longer syncing. Your data stays here.'); break;
  }
}, true);
document.addEventListener('submit', e => {
  if (e.target.id !== 'sp-add') return; e.preventDefault(); e.stopImmediatePropagation();
  const es = document.getElementById('sp-es').value, en = document.getElementById('sp-en').value;
  if (addPhrase(es, en)) { render(); setTimeout(() => document.getElementById('sp-es')?.focus(), 30); }
}, true);
// Desktop: Ctrl/Cmd + J opens quick capture
addEventListener('keydown', e => { if (e.key === 'Escape') qaClose(); });
addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'j') { e.preventDefault(); forceClose(); captureSheet(false); } });
// Home-screen shortcut: ?capture=1 opens capture with the mic; ?add=text runs a command directly
const q = new URLSearchParams(location.search);
if (q.get('add')) { runCommand(q.get('add'), { from: 'link' }); history.replaceState(null, '', location.pathname); }
else if (q.get('page') && ['workouts', 'todo', 'notes', 'habits', 'calendar', 'home'].includes(q.get('page'))) { page = q.get('page'); history.replaceState(null, '', location.pathname); try { sessionStorage.removeItem('2b-view'); } catch (e) {} }
else if (q.get('quiz')) { page = 'notes'; noteTab = 'Spanish'; noteFolder = 'all'; history.replaceState(null, '', location.pathname); try { sessionStorage.removeItem('2b-view'); } catch (e) {} setTimeout(() => startQuiz(), 600); }
else if (q.get('capture')) { setTimeout(() => captureSheet(true), 300); history.replaceState(null, '', location.pathname); }

/* ---------- Keep the bottom tray on the real bottom edge ----------
   Some in-app browsers (Google app, Gmail…) hide their toolbar without moving fixed elements. */
function pinBottom() {
  const vv = window.visualViewport; if (!vv) return;
  const off = Math.round(vv.offsetTop + vv.height - innerHeight);
  document.documentElement.style.setProperty('--vv-shift', (Math.abs(off) < 400 ? off : 0) + 'px');
}
if (window.visualViewport) { visualViewport.addEventListener('resize', pinBottom); visualViewport.addEventListener('scroll', pinBottom); }
addEventListener('scroll', pinBottom, { passive: true }); addEventListener('resize', pinBottom); pinBottom();

/* ---------- Pull down to sync everything ---------- */
let refreshing = false;
async function fullRefresh(manual) {
  if (refreshing) return; refreshing = true; ptrState('busy');
  try {
    checkUpdate();
    if (!cfg.url) { if (manual) notify('Connect Google sync first (the dot in the header).'); return; }
    let garmin = '';
    try { const r = await api({ action: 'strava' }); cfg.strava = r.strava; garmin = r.strava && r.strava.error ? 'Strava: ' + r.strava.error : r.added ? r.added + ' new Garmin activit' + (r.added === 1 ? 'y' : 'ies') : ''; } catch (e) { garmin = ''; }
    cfg.planAt = 0; saveCfg();
    await sync(false);
    if (manual) notify(/^Synced/.test(cfg.status || '') ? 'Synced: workouts, plan, calendar, notes.' + (garmin ? ' ' + garmin + '.' : '') : cfg.status);
  } finally { refreshing = false; ptrState(''); }
}
document.body.insertAdjacentHTML('beforeend', '<div class="ptr" id="ptr" aria-hidden="true"><span class="ptr-spin"></span><span class="ptr-t">Pull to sync</span></div>');
function ptrState(st, pull) {
  const el = document.getElementById('ptr'); if (!el) return;
  el.dataset.state = st; const t = el.querySelector('.ptr-t');
  if (st === 'busy') { el.style.transform = 'translate(-50%,12px)'; t.textContent = 'Syncing…'; }
  else if (st === 'pull') { el.style.transform = `translate(-50%,${Math.min(pull, 90) - 50}px)`; t.textContent = pull > 70 ? 'Release to sync' : 'Pull to sync'; el.classList.toggle('ready', pull > 70); }
  else { el.style.transform = ''; el.classList.remove('ready'); }
}
let ptr = null;
addEventListener('touchstart', e => { if (scrollY > 2 || $('#modal-root').children.length || drag || press || e.touches.length !== 1) { ptr = null; return; } ptr = { y: e.touches[0].clientY, d: 0 }; }, { passive: true });
addEventListener('touchmove', e => { if (!ptr || refreshing) return; ptr.d = e.touches[0].clientY - ptr.y; if (scrollY > 2 || drag) { ptr = null; ptrState(''); return; } if (ptr.d > 10) ptrState('pull', ptr.d * 0.6); }, { passive: true });
addEventListener('touchend', () => { if (!ptr) return; const go = ptr.d * 0.6 > 70; ptr = null; if (go) fullRefresh(true); else ptrState(''); });
// A browser reload (Safari's own pull-to-refresh) also runs the full sync
const navType = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0] || {}).type;

if (firstRun) _save();
markChanges();
// Pull-to-refresh / reload keeps you on the page you were on (for this session)
let lastPage = page;
try {
  const v = JSON.parse(sessionStorage.getItem('2b-view') || 'null');
  if (v && ['home', 'todo', 'notes', 'workouts', 'habits', 'calendar'].includes(v.page)) {
    page = v.page; lastPage = page;
    if (v.noteTab) noteTab = v.noteTab; if (v.week) week = v.week; if (v.month) month = v.month; if (v.selectedDate) selectedDate = v.selectedDate; if (v.taskFilter) taskFilter = v.taskFilter;
    if (v.y) setTimeout(() => scrollTo(0, v.y), 50);
  }
} catch (e) {}
addEventListener('pagehide', () => { try { const v = JSON.parse(sessionStorage.getItem('2b-view') || '{}'); v.y = scrollY; sessionStorage.setItem('2b-view', JSON.stringify(v)); } catch (e) {} });
render();
if (cfg.url) { if (navType === 'reload') fullRefresh(true); else sync(); }
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.__2b = { addPhrase, startQuiz, phrases, runCommand, splitDate, parseDay, eventKind, localSummary, sync, loadPlan, cfg: () => cfg };
})();
