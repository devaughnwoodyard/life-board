[data-design="native"] .hero{background:#e8edff;color:#294ea2;border:1px solid #dbe3ff}
[data-design="native"] .page-title h1{font-size:42px}
/* 02 · Paper — warm binder, ruled paper, serif text, amber controls. */
[data-design="paper"]{--font:Paper,Georgia,serif;--bg:#f8f3e6;--paper:#fffdf5;--ink:#3c3529;--muted:#817766;--line:#e2d8bd;--soft:#f1e8cb;--accent:#966d0f;--accentInk:#fffdf5;--radius:3px}

.cc-drawer{position:absolute;top:0;right:0;bottom:0;width:min(440px,90%);z-index:20;animation:ccIn .22s ease}
.cc-drawer>.dk-pane{height:100%;background:color-mix(in srgb,var(--solid) 92%,transparent);box-shadow:-18px 0 50px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
@keyframes ccIn{from{transform:translateX(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){.cc-drawer{animation:none}}

/* spines: full-height tabs */
.cc-spine{flex:none;width:58px;display:flex;flex-direction:column;gap:6px;min-height:0}
.cc-tab{flex:1 1 0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;border-radius:18px;background:color-mix(in srgb,var(--paper) 70%,transparent);border:1px solid var(--line);color:var(--muted);transition:background .2s,color .2s}
.cc-tab:hover{color:var(--ink);background:var(--paper)}
.cc-tab-ico svg{width:20px;height:20px}
.cc-tab-label{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;font-weight:800;letter-spacing:.02em;color:inherit}
.cc-tab-stat{margin-top:auto;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.cc-tab.on{background:var(--accent);border-color:transparent;color:var(--accentInk)}
.cc-tab.on .cc-tab-stat{color:color-mix(in srgb,var(--accentInk) 75%,transparent)}
.cc-spine-todo .cc-tab{background:var(--paper);color:var(--ink);border-color:var(--line)}
.cc-spine-todo .cc-tab .cc-tab-ico{color:var(--accent)}
.cc-spine-todo .cc-tab .cc-tab-stat{color:var(--muted)}
.cc[data-v="B"] .cc-tab{border-radius:0 16px 16px 0}
.cc[data-v="B"] .cc-spine-right .cc-tab{border-radius:16px 0 0 16px}
.cc[data-v="D"] .cc-spine-right .cc-tab{border-radius:16px 0 0 16px}
.cc-todo-ctl{display:inline-flex;gap:4px;margin-left:auto;padding-left:6px}
.cc-todo-ctl button{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--soft);color:var(--ink)}
.cc-todo-ctl svg{width:15px;height:15px}
.cc-todo .todo-heading-line{display:flex;align-items:center}
.cc-todo-slim .todo-quick-add input{min-width:0}

/* ============ Layer 3: sticky notes ============ */
#app .binder-panel{container-type:inline-size}
#app .sticky-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:16px 12px;margin:14px 0 6px;padding:4px 2px 8px}
@container (min-width:560px){#app .sticky-wall{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px 18px}}
#app .sticky-wall .note-card{position:relative;display:flex;flex-direction:column;gap:6px;margin:0!important;padding:18px 12px 10px!important;min-height:178px;border:0!important;border-radius:3px 3px 3px 3px!important;background:linear-gradient(135deg,var(--st) 0%,var(--st) 82%,var(--st2) 100%)!important;color:var(--sink);box-shadow:0 1px 1px rgba(0,0,0,.12),0 10px 22px -8px rgba(0,0,0,.45)!important;transform:rotate(var(--tilt,-1deg));transition:transform .18s ease,box-shadow .18s ease;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
#app .sticky-wall .note-card:hover,#app .sticky-wall .note-card:focus-within{transform:rotate(0) translateY(-2px);box-shadow:0 2px 2px rgba(0,0,0,.12),0 16px 30px -10px rgba(0,0,0,.5)!important;z-index:2}
#app .sticky-wall .note-card::before{content:"";position:absolute;top:-8px;left:50%;width:58px;height:17px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,255,255,.42);box-shadow:0 1px 2px rgba(0,0,0,.08);border-radius:2px}
#app .sticky-wall .note-card::after{content:"";position:absolute;right:0;bottom:0;width:18px;height:18px;background:linear-gradient(315deg,transparent 50%,rgba(0,0,0,.13) 50%,rgba(255,255,255,.35) 100%);border-radius:0 0 3px 0}
#app .sticky-wall .note-card:nth-child(5n+2){--tilt:.9deg}
#app .sticky-wall .note-card:nth-child(5n+3){--tilt:-.5deg}
#app .sticky-wall .note-card:nth-child(5n+4){--tilt:1.3deg}
#app .sticky-wall .note-card:nth-child(5n+5){--tilt:-1.4deg}

#app .sticky-wall .note-top{display:flex;align-items:flex-start;gap:4px;margin:0;padding:0;border:0}
#app .sticky-wall .note-title-btn{flex:1;min-width:0;text-align:left;padding:0;background:none;color:inherit}
#app .sticky-wall .note-card h3{margin:0;font:800 15px/1.2 "Manrope",system-ui,sans-serif;letter-spacing:-.01em;color:var(--sink);overflow-wrap:anywhere}
#app .sticky-wall .pin-btn{width:26px;height:26px;margin:-4px -4px 0 0;display:grid;place-items:center;border-radius:50%;background:none;color:var(--smut)}
#app .sticky-wall .pin-btn svg{width:15px;height:15px}
#app .sticky-wall .pin-btn.on{color:#d93a4a}
#app .sticky-wall .note-preview{text-align:left;padding:0;background:none;color:inherit;flex:1}
#app .sticky-wall .note-preview p{margin:0;font:500 12.5px/1.45 "Manrope",system-ui,sans-serif;color:var(--ssub);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
#app .sticky-wall .note-entered{font-size:0;color:var(--smut);margin:0;padding:0;border:0}
#app .sticky-wall .note-entered br{display:none}
#app .sticky-wall .note-entered b{font:600 10.5px/1.2 "Manrope",system-ui,sans-serif;color:var(--smut)}
#app .sticky-wall .note-review-meta{display:flex;justify-content:space-between;gap:6px;font:600 10.5px/1.2 "Manrope",system-ui,sans-serif;color:var(--smut);margin:0;padding:0;border:0}
#app .sticky-wall .note-review-meta span:last-child{color:var(--accent)}
#app .sticky-wall .note-bottom{display:flex;justify-content:space-between;gap:2px;margin:2px -4px 0;padding:6px 0 0;border-top:1px dashed var(--sline)!important}
#app .sticky-wall .note-bottom button{display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:7px;background:none;color:var(--ssub);font:700 11px/1 "Manrope",system-ui,sans-serif}
#app .sticky-wall .note-bottom button:hover{background:rgba(0,0,0,.07)}
#app .sticky-wall .note-bottom svg{width:14px;height:14px;color:inherit}
@container (max-width:420px){#app .sticky-wall .note-bottom button{font-size:0;gap:0;padding:5px}#app .sticky-wall .note-bottom svg{width:16px;height:16px}}
@media(prefers-reduced-motion:reduce){#app .sticky-wall .note-card{transition:none}}
#app .sticky-add{min-height:178px;border:2px dashed var(--line);border-radius:6px;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:700 12.5px/1 "Manrope",system-ui,sans-serif}
#app .sticky-add:hover{border-color:var(--accent);color:var(--ink)}
#app .sticky-add svg{width:22px;height:22px}
/* ============ Layer 4 ============ */
#app [data-action="recall-note"],#app .note-review-meta,#app .notes-filters [data-value="due"],#app .reveal-note{display:none!important}
#app .quick-note{display:grid;gap:8px;margin:12px 0 4px;padding:12px 12px 10px;border-radius:6px;background:var(--s0);color:var(--sink);border:1px solid var(--sline);box-shadow:0 8px 18px -10px rgba(0,0,0,.5)}
#app .quick-note textarea{width:100%;min-height:58px;resize:vertical;border:0;padding:0;background:none;color:var(--sink);font:600 14.5px/1.45 "Manrope",system-ui,sans-serif;outline:none}
#app .quick-note textarea::placeholder{color:var(--smut);font-weight:500}
#app .quick-note:focus-within{box-shadow:0 0 0 2px var(--accent),0 8px 18px -10px rgba(0,0,0,.5)}
#app .quick-note-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--sline);padding-top:8px}
#app .quick-note-row span{font:600 11px/1 "Manrope",system-ui,sans-serif;color:var(--smut)}
#app .quick-note-row button{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 13px;border-radius:9px;background:var(--accent);color:var(--accentInk);font:800 12.5px/1 "Manrope",system-ui,sans-serif}
#app .quick-note-row button svg{width:15px;height:15px}
@media(hover:none){#app .quick-note-row span{visibility:hidden}}

/* sticky palettes: set on #app[data-sticky] */
#app{--s0:#efe7d6;--s1:#efe7d6;--s2:#dde5d9;--s3:#dbe2ec;--s4:#ecdcd3;--s5:#e3def0;--sink:#26231d;--ssub:rgba(38,35,29,.78);--smut:rgba(38,35,29,.55);--sline:rgba(38,35,29,.16);--stape:rgba(255,255,255,.5)}
#app[data-sticky="muted"][data-mode="dark"]{--s0:#d9cfba;--s1:#d9cfba;--s2:#c4cfc0;--s3:#c2cbd8;--s4:#d6c3b8;--s5:#cbc4dc}
#app[data-sticky="aurora"]{--s0:#ece8fb;--s1:#ece8fb;--s2:#dff2ee;--s3:#e2ebfa;--s4:#f7e8e0;--s5:#f6e4ee;--sink:#1c1a2b;--ssub:rgba(28,26,43,.76);--smut:rgba(28,26,43,.52);--sline:rgba(28,26,43,.13);--stape:rgba(139,123,255,.28)}
#app[data-sticky="aurora"][data-mode="dark"]{--s0:#25213b;--s1:#28233f;--s2:#1b3532;--s3:#1d2b42;--s4:#3a2925;--s5:#372333;--sink:#f2f0fb;--ssub:rgba(242,240,251,.78);--smut:rgba(242,240,251,.52);--sline:rgba(242,240,251,.14);--stape:rgba(139,123,255,.45)}
#app[data-sticky="mono"]{--s0:#ffffff;--s1:#ffffff;--s2:#ffffff;--s3:#ffffff;--s4:#ffffff;--s5:#ffffff;--sink:#17162a;--ssub:rgba(23,22,42,.76);--smut:rgba(23,22,42,.5);--sline:rgba(23,22,42,.12);--stape:rgba(139,123,255,.3)}
#app[data-sticky="mono"][data-mode="dark"]{--s0:#20202b;--s1:#20202b;--s2:#20202b;--s3:#20202b;--s4:#20202b;--s5:#20202b;--sink:#f1f1f6;--ssub:rgba(241,241,246,.76);--smut:rgba(241,241,246,.5);--sline:rgba(241,241,246,.12);--stape:rgba(139,123,255,.5)}
#app .sticky-wall .note-card{--st:var(--s1);background:var(--st)!important;border:1px solid var(--sline)!important}
#app .sticky-wall .note-card:nth-child(5n+2){--st:var(--s2)}
#app .sticky-wall .note-card:nth-child(5n+3){--st:var(--s3)}
#app .sticky-wall .note-card:nth-child(5n+4){--st:var(--s4)}
#app .sticky-wall .note-card:nth-child(5n+5){--st:var(--s5)}
#app .sticky-wall .note-card::before{background:var(--stape)!important}
#app .sticky-wall .note-card::after{background:linear-gradient(315deg,transparent 50%,var(--sline) 50%,var(--stape) 100%)!important}
/* ============ Layer 5: one type system ============ */
#app,#app *:not(svg):not(path):not(circle):not(rect):not(line):not(polyline):not(polygon){font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif!important}
#app svg text{font-family:"Manrope",system-ui,sans-serif!important}
#app h1{font-size:28px!important;font-weight:800!important;letter-spacing:-.03em!important;line-height:1.1!important;text-transform:none!important}
#app .dk-pane h1,#app .dk-pane .todo-heading-line h1{font-size:22px!important}
#app h2{font-size:19px!important;font-weight:800!important;letter-spacing:-.02em!important;line-height:1.2!important;text-transform:none!important}
#app h3{font-size:15px!important;font-weight:700!important;letter-spacing:-.01em!important;line-height:1.3!important;text-transform:none!important}
#app .task-title,#app .habit-title,#app .phrase strong,#app .event b,#app .evt-body h3{font-size:15px!important;font-weight:600!important;letter-spacing:-.005em!important}
#app p{line-height:1.5}
#app .task-meta,#app .section-note,#app .reminders-section-meta,#app .section-date,#app .count,#app .later-day,#app .habit-sub,#app .note-entered b,#app .note-review-meta,#app .phrase small,#app .cc-sub,#app .subtitle,#app .description{font-size:12px!important;letter-spacing:0!important}
#app .eyebrow,#app .later-day,#app .habit-days,#app .cal-weekday,#app .agenda-time{font-size:10.5px!important;font-weight:700!important;letter-spacing:.06em!important}
#app .eyebrow{text-transform:uppercase}
#app .text-btn,#app .note-bottom button,#app .notes-filters button,#app .segmented button,#app .phrases-filter button,#app .inline-add,#app .wide-button,#app .todo-footer-actions button,#app .binder-actions button{font-size:12.5px!important;font-weight:700!important;letter-spacing:0!important}
#app .binder-tabs button,#app .cc-tab-label{font-size:12.5px!important;font-weight:700!important;letter-spacing:.02em!important}
#app input,#app textarea,#app select{font-size:14.5px!important}
#app b,#app strong{font-variant-numeric:tabular-nums}
#app .sheet h2{font-size:20px!important}
/* consistent card surfaces */
#app .task-list,#app .calendar-event,#app .workout,#app .planning-day,#app .habit-row,#app .score-hero,#app .sync-bar,#app .vol-chart,#app .binder-panel{border-radius:16px}

.vb-label{padding:0 6px 0 10px;color:#9a9cab;align-self:center}
body[data-appearance="light"] .vb-label{color:#6b6983}
/* ============ Layer 7 ============ */
#app .todo-new{width:100%;height:50px;margin:4px 0 2px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;background:var(--accent);color:var(--accentInk);font-size:15px!important;font-weight:800!important;box-shadow:0 10px 26px -12px var(--accent)}
#app .todo-new svg{width:20px;height:20px}
#app .todo-new:active{transform:scale(.99)}
#app .task .task-meta{display:none!important}
#app .task{min-height:54px!important}
#app .task-main{justify-content:center}
/* ============ Layer 8: keep everything on screen ============ */
html{box-sizing:border-box;height:100%}
body{height:100%;min-height:0!important;overflow:hidden}
.stage{min-height:0!important;height:100%}
@media(max-width:520px){.stage{height:100%}.device{height:100%!important;max-height:100%!important}}
/* iOS zooms into any field under 16px; keep fields at 16px on touch screens */
@media(hover:none),(max-width:520px){#app input,#app textarea,#app select,#app .quick-note textarea{font-size:16px!important}}
#app .overlay{position:fixed;inset:0;z-index:80;padding:10px 0 0;box-sizing:border-box}
#app .sheet{max-height:100%!important;width:100%;max-width:560px;margin:0 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:max(20px,env(safe-area-inset-bottom))!important;box-sizing:border-box}
body[data-view="desktop"] #app .overlay{padding:24px}
body[data-view="desktop"] #app .sheet{max-height:min(86vh,100%)!important}
#app .toast{position:fixed!important;z-index:90}

#app .plan-bottom{margin:24px 0 8px}
/* ============ Layer 9: Apple-style interaction polish ============ */
/* Tab bar: tint the selected tab, no heavy blob or ring (iOS tab bar) */
#app .bottom-nav{height:72px!important;min-height:72px!important;padding:6px 6px!important;border-radius:30px!important}
#app[data-dock] .nav-item{height:58px!important;min-height:58px!important;border-radius:22px!important;gap:3px!important;color:var(--muted)!important;background:none!important;outline:0!important;border:0!important;margin:0!important;font-size:10px!important;font-weight:600!important;transition:color .2s,background-color .2s}
#app[data-dock] .nav-item.active{color:var(--accent)!important;background:color-mix(in srgb,var(--accent) 16%,transparent)!important}
#app .nav-item .nav-icon{background:none!important;border:0!important;width:auto!important;min-width:0!important;height:auto!important}
#app .nav-item svg{width:24px!important;height:24px!important}
#app .nav-item.day-complete .nav-icon{color:#30b954}

/* One quiet header: title + actions; appearance lives in the ⋯ menu */
#app .compact-head .final-theme,#app .compact-head [data-action="final-theme"]{display:none!important}
#app .compact-head .icon-btn{width:40px!important;min-width:40px!important;height:40px!important;opacity:1!important;position:relative}
#app .compact-head .icon-btn::after{content:"";position:absolute;inset:-4px}
#app .compact-head h1{transition:font-size .22s ease}
#app.scrolled .compact-head h1{font-size:19px!important}

/* 44pt minimum hit targets for text actions */
#app .text-btn,#app .inline-add,#app .habit-sub button,#app .wo-actions button,#app .plan-links button,#app .note-bottom button,#app .notes-filters button,#app .phrases-filter button{min-height:44px;display:inline-flex;align-items:center}
#app .habit-box{min-width:36px;min-height:36px}

/* Pressed feedback, like UIKit highlight */
#app button{-webkit-tap-highlight-color:transparent;transition:transform .12s ease,opacity .12s ease,background-color .2s,color .2s}
#app button:not(.task-main):not(.note-preview):not(.note-title-btn):not(.nav-item):active{transform:scale(.96);opacity:.82}
#app .task-main:active,#app .note-preview:active{opacity:.6}
#app .nav-item:active{transform:scale(.94)}
#app .sticky-wall .note-card:active{transform:rotate(0) scale(.985)}

/* Completing a to-do: fill the circle first, then the row leaves */
#app .task.checking .check:before{background:var(--accent)!important;border-color:var(--accent)!important;transition:background .18s}
#app .task.checking .check::after{content:"";position:absolute;left:9px;top:16px;width:7px;height:12px;border:solid var(--accentInk);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
#app .task.checking{transition:opacity .25s ease .12s;opacity:.45}
#app .task.checking .task-title{text-decoration:line-through}

/* Destructive actions need a second tap */
#app .danger.armed{background:#e5484d!important;color:#fff!important;border-color:#e5484d!important;border-radius:12px;padding:10px 14px}

/* Sheets: grabber you can drag, gentle spring */
#app .sheet-handle{width:40px;height:5px;border-radius:3px;margin:8px auto 4px;background:color-mix(in srgb,var(--ink) 28%,transparent);touch-action:none;cursor:grab;position:relative}
#app .sheet-handle::after{content:"";position:absolute;inset:-14px -60px}
#app .sheet{transition:transform .28s cubic-bezier(.2,.9,.25,1)}
#app .sheet.dragging{transition:none}
#app .overlay{animation:lbFade .2s ease}
#app .overlay .sheet{animation:lbUp .32s cubic-bezier(.2,.9,.25,1)}
@keyframes lbFade{from{background:transparent}}
@keyframes lbUp{from{transform:translateY(40px);opacity:.4}}

/* Toast reads like an iOS banner */
#app .toast{left:50%!important;right:auto!important;transform:translateX(-50%);width:min(420px,calc(100% - 32px))!important;bottom:calc(92px + env(safe-area-inset-bottom))!important;border-radius:16px!important;padding:12px 14px!important;box-shadow:0 12px 34px rgba(0,0,0,.35)!important;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#app .toast button{min-height:36px;padding:0 12px;border-radius:10px;font-weight:800;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
body[data-view="desktop"] #app .toast{left:auto!important;right:28px!important;transform:none;bottom:28px!important}

@media(prefers-reduced-motion:reduce){#app *,#app *::before,#app *::after{animation:none!important;transition:none!important}#app .sticky-wall .note-card{transform:none!important}}
/* ============ Layer 10: folders, small stickies, attachments ============ */
#app .note-new{width:100%;height:46px;margin:10px 0 4px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:var(--accent);color:var(--accentInk);font-size:15px!important;font-weight:800!important}
#app .note-new svg{width:19px;height:19px}
#app .binder-actions button svg{width:22px;height:22px}
#app .lbn-folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin-top:14px}
#app .lbn-folder{display:grid;justify-items:start;align-content:start;gap:3px;min-height:100px;padding:12px;border-radius:14px;background:var(--paper);border:1px solid var(--line);color:var(--ink);text-align:left;min-width:0}
#app .lbn-folder svg{width:34px;height:34px;margin-bottom:4px;fill:color-mix(in srgb,var(--accent) 28%,transparent);stroke:var(--accent);stroke-width:1.5}
#app .lbn-folder strong{font-size:14.5px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#app .lbn-folder small{font-size:12px;color:var(--muted)}
#app .lbn-folder-add{background:none;border-style:dashed;color:var(--muted)}
#app .lbn-folder-add svg{fill:none;stroke:var(--muted)}
#app .lbn-crumb{display:flex;justify-content:space-between;align-items:center;margin:8px -4px 0}
#app .lbn-crumb button{background:none!important;border:0!important;min-height:44px;display:inline-flex;align-items:center;gap:4px;padding:0 6px;color:var(--accent);font-size:14px!important;font-weight:700!important}
#app .lbn-crumb svg{width:18px;height:18px}
#app .lbn-label{margin:12px 2px 0;font-size:12px;color:var(--muted);font-weight:600}
#app .lbn-empty{margin-top:12px;padding:22px 12px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:13px}

function renderHabits(){const days=Array.from({length:5},(_,i)=>addDay(i-4));const ticks=data.habits.reduce((a,h)=>a+days.filter(d=>h.days.includes(d)).length,0);return head()+title('Habit Tracker','Small things, done consistently.')+hero(Math.round(ticks/(data.habits.length*5||1)*100)+'%','of your last five days',`${ticks} check-ins · progress over perfection`,'leaf')+
 `<section class="section">${sectionHead('Your daily rituals','',data.habits.length,'habit')}<div class="habit-days"><span>Last 5 days</span>${days.map(d=>`<span>${d===localDay()?'Today':fmt(d,{weekday:'narrow'})}<br>${asDate(d).getDate()}</span>`).join('')}</div>${data.habits.map(h=>`<article class="habit-row"><div class="habit-grid"><div class="habit-title">${escapeHTML(h.title)}</div>${days.map(d=>`<button class="habit-box ${h.days.includes(d)?'on':''}" data-action="habit-tick" data-id="${h.id}" data-date="${d}" aria-label="${escapeHTML(h.title)}, ${fmt(d)}, ${h.days.includes(d)?'completed':'not completed'}" aria-pressed="${h.days.includes(d)}">${h.days.includes(d)?icon('check'):''}</button>`).join('')}</div><div class="habit-sub"><span>${escapeHTML(h.goal)} · ${days.filter(d=>h.days.includes(d)).length}/5 days</span><button data-action="edit-habit" data-id="${h.id}">Edit</button></div></article>`).join('')}<button class="inline-add" data-action="new-habit">${icon('plus')}Add a habit</button></section><p class="footnote">Tap any box to update that day.<br>Your five-day window rolls forward automatically.</p>`}
function render({preserveScroll=false}={}){const page=$('#page'),scroll=page.scrollTop;$('#app').dataset.design=DESIGNS[state.design].id;page.innerHTML=({todo:renderTodo,calendar:renderCalendar,workouts:renderWorkouts,notes:renderNotes,habits:renderHabits})[state.tab]();page.scrollTop=preserveScroll?scroll:0;$('#nav').innerHTML=NAV.map(([key,label,ico])=>`<button class="nav-item ${key===state.tab?'active':''}" data-action="nav" data-value="${key}" ${state.tab===key?'aria-current="page"':''} aria-label="${label}"><span class="nav-icon">${icon(ico)}</span><span>${label}</span></button>`).join('');$('#add').innerHTML=icon('plus');$('#add').setAttribute('aria-label',state.tab==='notes'?(state.binder==='spanish'?'Add a Spanish phrase':'Add a note'):state.tab==='habits'?'Add a habit':state.tab==='workouts'?'Add a workout':'Add a task');updateDesignBar();}
function updateDesignBar(){const d=DESIGNS[state.design];$('#design-picker').innerHTML=`<span>${String(state.design+1).padStart(2,'0')} / 10</span><strong>${d.name}</strong><span class="browse">ALL DESIGNS</span>`;$('#prev-design').innerHTML=icon('left');$('#next-design').innerHTML=icon('right');$('#prev-design').disabled=state.design===0;$('#next-design').disabled=state.design===9;document.querySelector('meta[name=theme-color]').content=d.colors[2]}
function navigate(tab){if(!NAV.some(n=>n[0]===tab)||state.modal)return;const old=NAV.findIndex(n=>n[0]===state.tab);state.tab=tab;state.query='';state.search=false;render();const page=$('#page');page.style.setProperty('--motion',NAV.findIndex(n=>n[0]===tab)>old?'14px':'-14px');page.classList.remove('enter');void page.offsetWidth;page.classList.add('enter')}
function chooseDesign(index){state.design=Math.max(0,Math.min(9,index));$('#gallery').hidden=true;render({preserveScroll:true})}
function gallery(){const g=$('#gallery');g.innerHTML=`<div class="gallery-top"><h2>10 directions.</h2><button data-action="gallery-close" aria-label="Close design gallery">${icon('close')}</button></div><p class="gallery-intro">Choose a look, then explore all five tabs.<br>Each keeps the same tasks, notes and progress.<br><b>Compare the same screen</b> with the top arrows.</p><div class="design-grid">${DESIGNS.map((d,i)=>`<button class="design-card ${state.design===i?'selected':''}" data-action="design" data-index="${i}"><div class="mini app" data-design="${d.id}"><div class="mini-top">2nd Brain / ${String(i+1).padStart(2,'0')}</div><h3>To Do</h3><div class="mini-hero"><b>4</b><span>things for today<br>One thing at a time.</span></div><div class="mini-label">Today</div><div class="mini-task"><span class="mini-check"></span><span>Draft Q4 roadmap</span><em>7/10</em></div><div class="mini-task"><span class="mini-check"></span><span>Renew passport</span><em>4/10</em></div><div class="mini-nav">${NAV.map(n=>icon(n[2])).join('')}</div></div><div class="design-info"><b>${String(i+1).padStart(2,'0')} · ${d.name}</b><small>${d.inspiration}<br>${d.font} · ${d.style}</small><span class="design-detail">${d.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</span></div></button>`).join('')}</div><p class="gallery-foot">Mobile concepts · simulated integrations.<br>Changes stay in this browser and carry across all 10 looks.<br>Swipe left or right inside the app to switch tabs.</p>`;g.hidden=false;g.scrollTop=0}
let toastTimer;function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3400)}
let previouslyFocused=null;
function sheet(name,body,{form=false,submit='',kind='',record=''}={}){if(!state.modal)previouslyFocused=document.activeElement;state.modal={kind,record};$('#modal-root').innerHTML=`<div class="overlay" id="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${escapeHTML(name)}"><div class="sheet-handle"></div><div class="sheet-header"><h2>${name}</h2><button class="icon-btn" data-action="modal-close" aria-label="Close dialog">${icon('close')}</button></div>${form?`<form id="editor-form">${body}<button class="submit" type="submit">${submit||'Save'}</button></form>`:body}</section></div>`;$('#overlay').addEventListener('pointerdown',e=>{if(e.target.id==='overlay')closeModal()});setTimeout(()=>{const el=$('#modal-root input:not([type=range]),#modal-root textarea');(el||$('#modal-root button'))?.focus({preventScroll:true})},100)}
function closeModal(){stopVoice();state.modal=null;$('#modal-root').innerHTML='';previouslyFocused?.focus?.({preventScroll:true})}
function baseTaskEditor(t=null,date=localDay()){const editing=!!t?.id;const d=t||{title:'',date,time:'',minutes:20,effort:3,note:''};sheet(editing?'Edit to-do':'New to-do',`<label for="task-title">What needs doing?</label><input id="task-title" name="title" value="${escapeHTML(d.title)}" placeholder="Add something to your day" required maxlength="180"><div class="row"><div><label for="task-date">Date · optional</label><input type="date" id="task-date" name="date" value="${d.date||''}"></div><div><label for="task-time">Time · optional</label><input type="time" id="task-time" name="time" value="${d.time||''}"></div></div><button type="button" class="text-btn" data-action="clear-date">${icon('close')}Remove date · keep in Today</button><label for="task-effort">Effort <b id="effort-value">${d.effort}</b> / 10</label><input id="task-effort" name="effort" type="range" min="1" max="10" step="1" value="${d.effort}"><div class="effort-scale"><span>1 · light</span><span>10 · demanding</span></div><label for="task-duration">Estimated minutes</label><input id="task-duration" name="minutes" type="number" min="1" max="1440" value="${d.minutes||20}" required><label for="task-note">Note</label><textarea id="task-note" name="note" rows="2" placeholder="Anything to remember">${escapeHTML(d.note)}</textarea><p class="description">No date keeps it in Today until it’s done. Past dates roll into Today.</p>${editing?'<div class="modal-actions"><button type="button" class="danger" data-action="delete-task" data-id="'+t.id+'">Delete to-do</button></div>':''}`,{form:true,submit:editing?'Save changes':'Add to-do',kind:'task',record:t?.id})}
function noteEditor(n=null){sheet(n?'Edit note':'New note',`<label for="note-title">Title</label><input id="note-title" name="title" value="${escapeHTML(n?.title||'')}" required maxlength="160"><label for="note-body">${state.binder==='work'?'Work':'Personal'} notebook</label><textarea id="note-body" name="body" rows="8" placeholder="Start writing…">${escapeHTML(n?.body||'')}</textarea>${n?`<button type="button" class="danger" data-action="delete-note" data-id="${n.id}">Delete note</button>`:''}`,{form:true,submit:'Save note',kind:'note',record:n?.id})}
function phraseEditor(p=null){sheet(p?'Edit phrase':'Add a phrase',`<label for="phrase-es">Spanish</label><input id="phrase-es" name="es" lang="es" value="${escapeHTML(p?.es||'')}" required maxlength="200"><label for="phrase-en">English meaning</label><input id="phrase-en" name="en" value="${escapeHTML(p?.en||'')}" required maxlength="200"><label for="phrase-note">Usage note · optional</label><textarea id="phrase-note" name="note" rows="2">${escapeHTML(p?.note||'')}</textarea><p class="description">Adds to your quiz pool and previews an update to “Spanish for Life Tool.” This mockup saves locally.</p>`,{form:true,submit:p?'Update phrase':'Add phrase',kind:'phrase-edit',record:p?.id})}
function habitEditor(h=null){sheet(h?'Edit habit':'New habit',`<label for="habit-title">Habit</label><input id="habit-title" name="title" value="${escapeHTML(h?.title||'')}" required maxlength="60"><label for="habit-goal">Daily target</label><input id="habit-goal" name="goal" value="${escapeHTML(h?.goal||'')}" placeholder="e.g. 20 minutes" required maxlength="80">${h?`<button type="button" class="danger" data-action="delete-habit" data-id="${h.id}">Delete habit</button>`:''}`,{form:true,submit:'Save habit',kind:'habit',record:h?.id})}
function workoutEditor(){sheet('Add a workout',`<label for="wo-title">Session</label><input id="wo-title" name="title" placeholder="e.g. Easy run" required maxlength="100"><div class="row"><div><label for="wo-date">Date</label><input id="wo-date" name="date" type="date" value="${localDay()}" required></div><div><label for="wo-time">Time of day</label><select id="wo-time" name="time"><option>AM</option><option>PM</option></select></div></div><label for="wo-kind">Type</label><select id="wo-kind" name="kind"><option value="run">Run</option><option value="bike">Bike</option><option value="swim">Swim</option><option value="workout">Strength</option><option value="yoga">Yoga</option></select><div class="row"><div><label for="wo-duration">Minutes</label><input id="wo-duration" name="duration" type="number" min="1" max="1440" value="45" required></div><div><label for="wo-effort">Effort · 1–10</label><input id="wo-effort" name="effort" type="number" min="1" max="10" value="4" required></div></div><label for="wo-distance">Target</label><input id="wo-distance" name="distance" placeholder="e.g. 5 mi" required maxlength="60">`,{form:true,kind:'workout',submit:'Add session'})}
function recordReview(p,correct){p.reviews.push({day:localDay(),correct});if(correct&&!p.passes.includes(localDay())&&p.passes.length<5)p.passes.push(localDay());p.updated=localDay();data.pending++;save()}
function phraseDetail(p,revealed=false){sheet('Phrase review',`<p class="eyebrow">${p.passes.length>=5?'Mastered':'Learning'} · ${p.reviews.length} total reviews</p><p class="detail-phrase" lang="es">${escapeHTML(p.es)}</p>${revealed?`<p class="detail-meaning">${escapeHTML(p.en)}</p>${p.note?`<p class="description">${escapeHTML(p.note)}</p>`:''}`:'<button class="wide-button" data-action="phrase-reveal" data-id="'+p.id+'">Reveal meaning</button>'}${boxes(p.passes.length)}<p class="description">${p.passes.length}/5 correct review days. Only one box can be earned per day.</p>${revealed?`<button class="wide-button primary" data-action="phrase-review" data-id="${p.id}" data-correct="yes">I remembered it</button><button class="wide-button" data-action="phrase-review" data-id="${p.id}" data-correct="no">Keep practicing</button>`:''}<h3 style="margin-top:23px">Review history</h3><ul class="history">${p.reviews.length?p.reviews.slice().reverse().map(r=>`<li>${fmt(r.day,{month:'short',day:'numeric',year:'numeric'})} · ${r.correct?'Remembered':'Practicing'}</li>`).join(''):'<li>No reviews yet. Start with this phrase.</li>'}</ul><button class="text-btn" data-action="edit-phrase" data-id="${p.id}">Edit phrase</button>`,{kind:'phrase-detail',record:p.id})}
function startQuiz(){const pool=data.phrases.filter(p=>p.passes.length<5).sort((a,b)=>(a.passes.includes(localDay())-b.passes.includes(localDay()))||a.passes.length-b.passes.length).slice(0,10);if(!pool.length){toast('All phrases are mastered. Add a phrase to start a new quiz.');return}state.quiz={queue:pool.map(p=>p.id),total:pool.length,correct:0,missed:0,answered:false,picked:null,options:[]};quizQuestion()}
function shuffle(list){return list.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.x)}
function quizQuestion(){const q=state.quiz;if(!q)return;if(!q.queue.length){data.lastQuiz={day:localDay(),total:q.total,missed:q.missed};save();sheet('Practice complete',hero(q.total,'phrases practiced',`${q.missed} missed answer${q.missed===1?'':'s'} revisited`,'spark')+'<p class="description">Correct answers add one review box per day. Missed phrases came back until you remembered them. Your progress is ready for the Sheet sync preview.</p><button class="submit" data-action="quiz-finish">Back to Spanish</button>',{kind:'quiz-done'});return}const p=data.phrases.find(p=>p.id===q.queue[0]);q.answered=false;q.picked=null;const wrong=shuffle([...new Set(data.phrases.filter(x=>x.id!==p.id&&x.en!==p.en).map(x=>x.en))]).slice(0,3);const fill=['Take care','Good morning','Be careful','Of course'];for(const x of fill){if(wrong.length>=3)break;if(x!==p.en&&!wrong.includes(x))wrong.push(x)}q.options=shuffle([p.en,...wrong]);renderQuiz(p)}
function renderQuiz(p){const q=state.quiz;sheet('Quiz me',`<p class="eyebrow">${q.correct} of ${q.total} phrases learned · ${q.queue.length} in queue</p><div class="progress" style="color:var(--accent)"><i style="width:${q.correct/q.total*100}%"></i></div><p class="quiz-question" lang="es">${escapeHTML(p.es)}</p><p class="description">Choose the English meaning.</p><div class="quiz-options">${q.options.map((o,i)=>`<button class="quiz-option ${q.answered?(o===p.en?'right':i===q.picked?'wrong':''):''}" data-action="quiz-answer" data-index="${i}" ${q.answered?'disabled':''}>${escapeHTML(o)}</button>`).join('')}</div>${q.answered?`<p class="quiz-feedback">${q.options[q.picked]===p.en?`<b>Correct.</b> ${p.passes.length}/5 correct review days.${p.passes.length===5?' This phrase is now mastered.':''}`:`<b>Keep practicing.</b> ${escapeHTML(p.en)}<br>This phrase will return later in the quiz.`}</p><button class="submit" data-action="quiz-next">${q.queue.length===1&&q.options[q.picked]===p.en?'Finish':'Next phrase'}</button>`:''}`,{kind:'quiz',record:p.id})}
function answerQuiz(index){const q=state.quiz;if(!q||q.answered)return;const p=data.phrases.find(p=>p.id===q.queue[0]);q.answered=true;q.picked=index;const correct=q.options[index]===p.en;recordReview(p,correct);if(correct)q.correct++;else q.missed++;renderQuiz(p)}
function quizNext(){const q=state.quiz;const current=q.queue.shift();const p=data.phrases.find(p=>p.id===current);if(q.options[q.picked]!==p.en)q.queue.push(current);quizQuestion()}
function info(name,body){sheet(name,`<p class="description">${body}</p><button class="submit" data-action="modal-close">Got it</button>`,{kind:'info'})}
function newItem(){if(state.tab==='notes')return state.binder==='spanish'?phraseEditor():noteEditor();if(state.tab==='habits')return habitEditor();if(state.tab==='workouts')return workoutEditor();taskEditor(null,state.tab==='calendar'?state.date:localDay())}

 case'binder':state.binder=d.value;render({preserveScroll:true});break;

state.workoutWeek=monday();state.workoutView='week';

 easy:{kind:'run',title:'Easy run',duration:45,planned:5,unit:'mi',basis:'distance',effort:4},

const durationLabel=min=>`${Math.floor(min/60)}h ${min%60}m`;
function weekSessions(start=state.workoutWeek){return data.workouts.filter(w=>w.date>=start&&w.date<addDay(7,start)).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time))}

function cumulativeVolume(list,w,actual=false){const at=list.findIndex(x=>x.id===w.id);const kind=w.kind==='workout'?(w.title==='Mobility'?'mobility':'strength'):w.kind;return list.slice(0,at+1).filter(x=>{const xkind=x.kind==='workout'?(x.title==='Mobility'?'mobility':'strength'):x.kind;return xkind===kind&&x.basis===w.basis&&(w.basis==='minutes'||x.unit===w.unit)&&(!actual||x.done)}).reduce((sum,x)=>sum+(w.basis==='minutes'?(actual?x.actualMinutes:x.duration):(actual?x.actual:x.planned)),0)}
function cumulativeLabel(list,w,actual=false){const val=actual?(w.basis==='minutes'?w.actualMinutes:w.actual):(w.basis==='minutes'?w.duration:w.planned);const unit=w.basis==='minutes'?'min':w.unit;return `${Number(val.toFixed(2)).toLocaleString()} ${unit} (${Number(cumulativeVolume(list,w,actual).toFixed(2)).toLocaleString()} ${unit} this week)`}

function weeklyVolume(list,actual=false){const sums={};list.filter(w=>w.basis==='distance'&&(!actual||w.done)).forEach(w=>{const key=w.kind+'|'+w.unit;sums[key]=(sums[key]||0)+(actual?w.actual:w.planned)});return Object.entries(sums).map(([k,v])=>{const[kind,unit]=k.split('|');return `${({run:'Run',bike:'Bike',swim:'Swim',yoga:'Yoga'})[kind]||'Distance'} ${Number(v.toFixed(2)).toLocaleString()} ${unit}`}).join(' · ')}
function weekSummary(list){const complete=list.filter(w=>w.done),planned=list.reduce((s,w)=>s+w.duration,0),actual=complete.reduce((s,w)=>s+w.actualMinutes,0);const rating=data.weekRatings[state.workoutWeek];return `<div class="weekly-summary"><div class="week-total"><span>PLANNED</span><b>${durationLabel(planned)}</b><small>${list.length} sessions</small></div><div class="week-total"><span>LOGGED</span><b>${durationLabel(actual)}</b><small>${complete.length} / ${list.length} sessions</small></div><div class="weekly-volume"><span>${weeklyVolume(list)||'No distance sessions planned.'}</span>${complete.length?`<span>Actual · ${weeklyVolume(complete,true)||durationLabel(actual)}</span>`:''}</div><div class="weekly-tools"><button data-action="copy-week">${icon('copy')}Copy week</button><button data-action="rate-week">${icon('star')}${rating?rating.score+'/5 · plan rating':'Rate this plan'}</button></div></div>`}
function weekNavigator(){const week=state.workoutWeek;return `<div class="week-navigator"><button class="icon-btn" data-action="workout-week" data-step="-1" aria-label="Previous workout week">${icon('left')}</button><div><span class="eyebrow">${week===monday()?'THIS WEEK':'WEEKLY PLAN'} · MON–SUN</span><h3>${fmt(week)} – ${fmt(addDay(6,week))}</h3></div><button class="icon-btn" data-action="workout-week" data-step="1" aria-label="Next workout week">${icon('right')}</button></div><div class="week-shortcuts">${Array.from({length:4},(_,i)=>{const d=addDay(i*7,monday());const n=weekSessions(d).length;return `<button data-action="workout-week-jump" data-date="${d}" class="${week===d?'on':''}"><span>${i===0?'This week':i===1?'Next week':'Week '+(i+1)}</span><b>${fmt(d)}</b><small>${n} sessions</small></button>`}).join('')}</div>`}
function dayPlanner(list){return `<div class="day-planner" data-local-swipe="workout">${Array.from({length:7},(_,i)=>{const date=addDay(i,state.workoutWeek),sessions=list.filter(w=>w.date===date),mins=sessions.reduce((s,w)=>s+w.duration,0);const tile=period=>{const matches=sessions.filter(w=>(w.time==='PM'?'PM':'AM')===period);return `<section class="workout-slot" aria-label="${period} workout slot"><div class="workout-slot-head"><b>${period}</b><small>${matches.length?matches.length+' session'+(matches.length===1?'':'s'):'Open'}</small></div>${matches.map(w=>`<div class="workout-slot-item"><div class="planned-session"><div><b>${escapeHTML(w.title)}</b><small>${w.duration} min · effort ${w.effort}/10</small>${w.done?`<small class="actual-cumulative">Actual: ${cumulativeLabel(list,w,true)}</small>`:''}</div><button data-action="log-workout" data-id="${w.id}" aria-label="${w.done?'Edit log for':'Log'} ${escapeHTML(w.title)} on ${fmt(w.date)}">${w.done?`${efficiency(w)}%`:icon('notes')}</button></div><div class="session-edit"><button data-action="edit-workout-plan" data-id="${w.id}">Edit session</button></div></div>`).join('')}<button class="workout-slot-add" data-action="new-day-session" data-date="${date}" data-period="${period}">${icon('plus')}<span>${matches.length?'Add another':'Add'} ${period}</span></button></section>`};return `<article class="planning-day ${date===localDay()?'today':''}"><div class="planning-day-head"><div><span>${fmt(date,{weekday:'short'})}</span><b>${asDate(date).getDate()}</b></div><div><h3>${date===localDay()?'Today':fmt(date,{weekday:'long'})}</h3><small>${sessions.length?sessions.length+' session'+(sessions.length===1?'':'s')+' · '+durationLabel(mins):'Rest or open'}</small></div></div><div class="workout-slots">${tile('AM')}${tile('PM')}</div>${sessions.length?`<div class="day-running-total"><span>Week through ${fmt(date,{weekday:'short'})}</span><b>${durationLabel(list.filter(x=>x.date<=date).reduce((s,x)=>s+x.duration,0))} planned · ${durationLabel(list.filter(x=>x.date<=date&&x.done).reduce((s,x)=>s+x.actualMinutes,0))} logged</b></div>`:''}</article>`}).join('')}</div>`}
function renderWorkouts(){const recent=data.workouts.filter(w=>w.done&&w.date>=addDay(-27));const avg=recent.length?Math.round(recent.reduce((a,w)=>a+efficiency(w),0)/recent.length):0;const list=weekSessions();const filtered=list.filter(w=>state.workoutView==='plan'?!w.done:w.done);return head()+title('Workouts','Plan your weeks. Log what you actually hit.')+scoreHero(avg,'Workout efficiency',`${recent.length} logged sessions · last 28 days`)+`<button class="multiweek-button" data-action="build-workout-plan">${icon('calendar')}<span><b>Plan several weeks</b><small>Build a weekly pattern · repeat it by day</small></span>${icon('arrow')}</button>${weekNavigator()}${weekSummary(list)}<div class="segmented" aria-label="Workout view"><button class="${state.workoutView==='week'?'on':''}" data-action="workout-view" data-value="week">By day</button><button class="${state.workoutView==='plan'?'on':''}" data-action="workout-view" data-value="plan">Upcoming</button><button class="${state.workoutView==='history'?'on':''}" data-action="workout-view" data-value="history">Logged</button></div><section class="section">${state.workoutView==='week'?dayPlanner(list):filtered.length?filtered.map(workoutListCard).join(''):'<div class="empty">No '+(state.workoutView==='history'?'logged':'upcoming')+' sessions in this week.</div>'}</section>${workoutTrend()}<p class="footnote">Weekly totals stay separate for planned and actual time.<br>Distances stay separated by sport and unit. Plan, Garmin and Sheet data are simulated.</p>`}

function previewPattern(){const f=$('#editor-form');if(!f||state.modal?.kind!=='plan-builder')return;f.querySelectorAll('.pattern-slot').forEach(slot=>{const select=slot.querySelector('select'),key=select.value,t=WORKOUT_TEMPLATES[key],target=slot.querySelector('.pattern-target'),minutes=slot.querySelector('.pattern-minutes');slot.querySelector('.pattern-targets').hidden=!t;target.disabled=!t||t.basis==='minutes';minutes.disabled=!t;if(!t)return;if(target.dataset.template!==key){target.value=t.planned;minutes.value=t.duration;target.dataset.template=key}slot.querySelector('.distance-target').hidden=t.basis==='minutes';slot.querySelector('.pattern-unit').textContent=t.unit;target.required=t.basis==='distance';minutes.required=true;});const v=Object.fromEntries(new FormData(f));const chosen=Object.keys(v).filter(k=>k.startsWith('day-')&&v[k]);const min=chosen.reduce((a,k)=>a+Number(v[k.replace('day-','minutes-')]),0);const weeks=Math.max(1,Math.min(12,Number(v.weeks)||1));$('#pattern-preview').innerHTML=chosen.length?`<b>${chosen.length*weeks} planned sessions · ${weeks} weeks</b><span>${chosen.length} sessions and ${durationLabel(min)} per week</span>`:'Choose at least one session to build your plan.';}

const plannerActions=new Set(['workout-week','workout-week-jump','build-workout-plan','sample-pattern','clear-pattern','copy-week','rate-week','new-day-session','edit-workout-plan','remove-workout-plan']);
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||!plannerActions.has(b.dataset.action))return;if(Date.now()<suppressClickUntil){e.preventDefault();e.stopImmediatePropagation();return}e.stopImmediatePropagation();const d=b.dataset;switch(d.action){
 case'workout-week':state.workoutWeek=addDay(Number(d.step)*7,state.workoutWeek);render({preserveScroll:true});break;
 case'workout-week-jump':state.workoutWeek=d.date;render({preserveScroll:true});break;

document.addEventListener('submit',e=>{const kind=state.modal?.kind;if(e.target.id!=='editor-form'||!['plan-builder','copy-week','week-rating','edit-workout-plan'].includes(kind))return;e.preventDefault();e.stopImmediatePropagation();const v=Object.fromEntries(new FormData(e.target));let message='Saved.';
 if(kind==='plan-builder'){const selections=Object.keys(v).filter(k=>k.startsWith('day-')&&v[k]);if(!selections.length){toast('Choose at least one AM or PM session.');return}const start=monday(v.start),weeks=Number(v.weeks);let count=0;for(let week=0;week<weeks;week++)for(const key of selections){const[,day,period]=key.split('-');const t={...WORKOUT_TEMPLATES[v[key]],duration:Number(v[key.replace('day-','minutes-')])};if(t.basis==='distance')t.planned=Number(v[key.replace('day-','target-')]);else t.planned=t.duration;if(addPlannedSession(t,addDay(week*7+Number(day),start),period))count++}state.workoutWeek=start;state.workoutView='week';message=`${count} sessions planned across ${weeks} weeks.`}
 if(kind==='copy-week'){const source=weekSessions().map(w=>({...w}));const start=monday(v.start),weeks=Number(v.weeks);let count=0;for(let i=0;i<weeks;i++)for(const w of source){const offset=dayDiff(state.workoutWeek,w.date);if(addPlannedSession(w,addDay(i*7+offset,start),w.time))count++}state.workoutWeek=start;state.workoutView='week';message=`${count} sessions copied into ${weeks} weeks.`}
 if(kind==='week-rating'){data.weekRatings[state.workoutWeek]={score:Number(v.score),comment:v.comment.trim()};message='Weekly plan rating saved.'}
 if(kind==='edit-workout-plan'){const w=data.workouts.find(w=>w.id===state.modal.record);Object.assign(w,{title:v.title.trim(),date:v.date,time:v.time,duration:Number(v.duration),effort:Number(v.effort),basis:v.basis,planned:Number(v.planned),unit:v.unit});w.distance=w.basis==='distance'?w.planned+' '+w.unit:w.duration+' min';message='Planned target updated.'}
 save();closeModal();render({preserveScroll:true});toast(message);
},true);

function cumulativeLabel(list,w,actual=false){const unit=w.basis==='minutes'?'min':w.unit;const aggregate=cumulativeVolume(list,w,actual);const key=x=>x.kind==='workout'?(x.title==='Mobility'?'mobility':'strength'):x.kind;const goal=list.filter(x=>key(x)===key(w)&&x.basis===w.basis&&(w.basis==='minutes'||x.unit===w.unit)).reduce((s,x)=>s+(w.basis==='minutes'?x.duration:x.planned),0);return `[${Number(aggregate.toFixed(2)).toLocaleString()} / ${Number(goal.toFixed(2)).toLocaleString()} ${unit}]`}

function focusTimeText(){const sec=focusTimer?Math.max(0,Math.ceil((focusTimerEnds-Date.now())/1000)):focusTimerRemaining;return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function tickFocus(){const el=$('#focus-display');if(el)el.textContent=focusTimeText();if(focusTimer&&Date.now()>=focusTimerEnds){clearInterval(focusTimer);focusTimer=null;focusTimerRemaining=0;toast('Focus timer finished.');if(el)focusSheet()}}
function toggleFocus(){if(focusTimer){focusTimerRemaining=Math.max(0,Math.ceil((focusTimerEnds-Date.now())/1000));clearInterval(focusTimer);focusTimer=null}else{if(!focusTimerRemaining)focusTimerRemaining=900;focusTimerEnds=Date.now()+focusTimerRemaining*1000;focusTimer=setInterval(tickFocus,500)}focusSheet()}
function effortBudgetSheet(budget){const sorted=remainingToday().slice().sort((a,b)=>a.effort-b.effort),fit=[];let spent=0;for(const t of sorted)if(spent+t.effort<=budget){spent+=t.effort;fit.push(t)}sheet('Effort budget',`<label for="effort-budget">Budget · 1–50</label><input id="effort-budget" name="budget" type="number" min="1" max="50" value="${budget}"><button class="wide-button" data-action="budget-recalculate">Recalculate</button><div class="budget-total"><b>${spent} / ${budget}</b><span>${fit.length} tasks fit</span></div><div class="ladder-list">${fit.map(t=>`<div><b>${t.effort}</b><span>${escapeHTML(t.title)}</span></div>`).join('')}</div>`,{kind:'effort-budget'})}
function gapFinder(){const day=state.tab==='calendar'?state.date:localDay();const occupied=[...events().filter(e=>e.date===day&&e.time&&e.end&&!e.reminder).map(e=>[minutesOf(e.time),minutesOf(e.end)]),...openTasks().filter(t=>t.date===day&&t.time).map(t=>[minutesOf(t.time),minutesOf(t.time)+(t.minutes||30)])].filter(([s,e])=>e>s&&e>480&&s<1200).map(([s,e])=>[Math.max(480,s),Math.min(1200,e)]).sort((a,b)=>a[0]-b[0]);let cursor=480,gaps=[];for(const[s,e]of occupied){if(s-cursor>=30)gaps.push([cursor,s]);cursor=Math.max(cursor,e)}if(1200-cursor>=30)gaps.push([cursor,1200]);surpriseHeader('Find a gap',`<p class="entry-label">${fmt(day)} · 8 AM–8 PM · sample calendar</p><div class="gap-list">${gaps.map(([s,e])=>`<button data-action="use-gap" data-date="${day}" data-time="${timeOf(s)}"><b>${timeFmt(timeOf(s))} – ${timeFmt(timeOf(e))}</b><span>${e-s} min available</span>${icon('plus')}</button>`).join('')||'<p class="description">No open window of 30 minutes.</p>'}</div>`)}
function minutesOf(t){const[h,m]=t.split(':').map(Number);return h*60+m}function timeOf(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function loadLens(){const days=Array.from({length:7},(_,i)=>addDay(i,state.workoutWeek));const rows=days.map(day=>{const list=data.workouts.filter(w=>w.date===day);return {day,planned:list.reduce((s,w)=>s+w.duration*w.effort,0),actual:list.filter(w=>w.done).reduce((s,w)=>s+w.actualMinutes*w.actualEffort,0)}});const max=Math.max(1,...rows.flatMap(r=>[r.planned,r.actual]));surpriseHeader('Load lens',`<p class="entry-label">${fmt(state.workoutWeek)} – ${fmt(addDay(6,state.workoutWeek))}</p><div class="load-legend"><span>Planned</span><span>Logged</span></div><div class="load-chart">${rows.map(r=>`<div><small>${fmt(r.day,{weekday:'narrow'})}</small><i style="--p:${r.planned/max*100}%;--a:${r.actual/max*100}%"><b></b><em></em></i><span>${r.planned} / ${r.actual}</span></div>`).join('')}</div><p class="description">Effort-minutes = duration × perceived effort. Planned and logged totals stay separate.</p>`)}

function oneThing(pick=false){const list=remainingToday();if(!list.length){info('One thing','No open to-dos for today.');return}if(pick||!list.some(t=>t.id===state.oneThing))state.oneThing=list[Math.floor(Math.random()*list.length)].id;const t=list.find(t=>t.id===state.oneThing);surpriseHeader('One thing',`<div class="one-task"><span class="eyebrow">EFFORT ${t.effort}/10</span><h2>${escapeHTML(t.title)}</h2><p>${t.minutes||'—'} min</p></div><button class="submit" data-action="one-complete" data-id="${t.id}">Complete</button><button class="wide-button" data-action="one-another">Choose another</button>`)}

function omniSheet(){surpriseHeader('Find anything',`<label for="omni-input">Search all five tabs</label><input id="omni-input" type="search" placeholder="A task, phrase, note or workout"><div id="omni-results" class="omni-results"></div>`,'omni');$('#omni-input').focus()}
function updateOmni(query){const q=query.trim().toLowerCase();const rows=[...data.tasks.map(t=>({type:'To-do',id:t.id,title:t.title,action:'omni-task'})),...data.notes.map(n=>({type:'Note',id:n.id,title:n.title,text:n.body,action:'omni-note'})),...data.workouts.map(w=>({type:'Workout',id:w.id,title:w.title,text:w.notes,action:'omni-workout'})),...data.phrases.map(p=>({type:'Spanish',id:p.id,title:p.es,text:p.en,action:'omni-phrase'}))].filter(x=>q&&(x.title+' '+(x.text||'')).toLowerCase().includes(q)).slice(0,15);$('#omni-results').innerHTML=rows.map(r=>`<button data-action="${r.action}" data-id="${r.id}"><small>${r.type}</small><span>${escapeHTML(r.title)}</span>${icon('arrow')}</button>`).join('')||`<p class="description">${q?'No matches.':'Search to see matching items.'}</p>`}
function recallMix(){const due=data.notes.filter(n=>n.nextReview<=localDay()),phrases=data.phrases.filter(p=>p.passes.length<5);const rows=[...due.map(n=>({id:n.id,type:'note',title:n.title})),...phrases.map(p=>({id:p.id,type:'phrase',title:p.es}))];surpriseHeader('Recall mix',`<div class="recall-mix">${shuffle(rows).slice(0,5).map(r=>`<button data-action="${r.type==='note'?'mix-note':'mix-phrase'}" data-id="${r.id}"><small>${r.type==='note'?'Note':'Spanish'}</small><b>${escapeHTML(r.title)}</b>${icon('right')}</button>`).join('')||'<p class="description">No reviews due.</p>'}</div>`)}

function targetMatrix(){const days=Array.from({length:7},(_,i)=>addDay(i,state.workoutWeek));surpriseHeader('Target matrix',`<div class="target-matrix"><div><b>Day</b><b>Plan</b><b>Actual</b><b>Score</b></div>${days.map(d=>{const ws=data.workouts.filter(w=>w.date===d),done=ws.filter(w=>w.done);const score=done.length?Math.round(done.reduce((s,w)=>s+efficiency(w),0)/done.length):null;return `<button data-action="matrix-day" data-date="${d}"><span>${fmt(d,{weekday:'short'})}</span><span>${ws.reduce((s,w)=>s+w.duration,0)}m</span><span>${done.reduce((s,w)=>s+w.actualMinutes,0)}m</span><strong>${score==null?'—':score+'%'}</strong></button>`}).join('')}</div>`)}

async function importNotes(file){try{const incoming=JSON.parse(await file.text());if(!Array.isArray(incoming.notes))throw Error('Not a notes backup.');let count=0;for(const raw of incoming.notes){if(typeof raw.title!=='string'||typeof raw.body!=='string')continue;const same=data.notes.find(n=>n.id===raw.id||(n.title===raw.title&&n.body===raw.body&&n.tab===raw.tab));if(same&&same.title===raw.title&&same.body===raw.body)continue;data.notes.push({id:id(),title:raw.title,body:raw.body,tab:raw.tab==='work'?'work':'personal',cue:typeof raw.cue==='string'?raw.cue:'',entered:!isNaN(Date.parse(raw.entered))?raw.entered:new Date().toISOString(),updated:localDay(),reviews:Array.isArray(raw.reviews)?raw.reviews.filter(r=>/^\d{4}-\d{2}-\d{2}$/.test(r.day)):[],nextReview:localDay(),pinned:!!raw.pinned});count++}for(const raw of incoming.phrases||[]){if(typeof raw.es!=='string'||typeof raw.en!=='string')continue;if(data.phrases.some(p=>p.es===raw.es&&p.en===raw.en))continue;data.phrases.push({id:id(),es:raw.es,en:raw.en,note:typeof raw.note==='string'?raw.note:'',passes:Array.isArray(raw.passes)?[...new Set(raw.passes.filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)))].slice(0,5):[],reviews:Array.isArray(raw.reviews)?raw.reviews.filter(r=>/^\d{4}-\d{2}-\d{2}$/.test(r.day)):[],entered:!isNaN(Date.parse(raw.entered))?raw.entered:new Date().toISOString(),updated:localDay()});count++}save();$('#import-result').textContent=`Imported ${count} entries. Existing notes preserved.`}catch(e){$('#import-result').textContent='Could not read that backup. Choose a notes JSON file.'}}
const revisionActions=new Set(['surprise','clear-date-save','move-task','move-task-no-date','jump-task-section','notes-backup','export-notes','timer-preset','timer-toggle','timer-reset','budget-recalculate','use-gap','ladder-apply','carry-move','one-complete','one-another','map-day','thumb-toggle','thumb-mic','omni','omni-task','omni-note','omni-workout','omni-phrase','mix-note','mix-phrase','chain-day','matrix-day']);

/* page-scoped rules (.app[data-page="x"]) re-scoped to dashboard panes */
(function scopeRules(){
 const re=/\.app\[data-page="(\w+)"\]((?:\[[^\]]+\])*)/g;
 const out=[];
 const walk=(rules,wrap)=>{for(const r of rules){
  if(r.cssRules&&r.conditionText!==undefined){const head=r.cssText.slice(0,r.cssText.indexOf('{'));walk(r.cssRules,head);continue}
  if(!r.selectorText||!r.selectorText.includes('data-page='))continue;
  const sels=r.selectorText.split(',').map(s=>s.trim()).filter(s=>s.includes('data-page=')).map(s=>s.replace(re,(m,pg,attrs)=>`#app${attrs} [data-pane="${pg}"]`)).filter(s=>!/\[data-pane="\w+"\]$/.test(s));
  if(!sels.length)continue;
  const body=r.cssText.slice(r.cssText.indexOf('{'));
  out.push(wrap?`${wrap}{${sels.join(',')}${body}}`:`${sels.join(',')}${body}`);
 }};
 for(const sh of document.styleSheets){try{walk(sh.cssRules,'')}catch(e){}}
 const el=document.createElement('style');el.id='pane-scope';el.textContent=out.join('\n');
 document.head.appendChild(el);
 const layer=document.getElementById('final-layer');if(layer)document.head.appendChild(layer);
})();

const VOL_KINDS=[['run','Run','#8b7bff'],['bike','Bike','#3fc6b4'],['swim','Swim','#5aa9ff'],['strength','Strength','#ff9a62'],['yoga','Yoga','#ff7aa8']];
const volKind=w=>w.kind==='yoga'||/yoga|mobility/i.test(w.title)?'yoga':w.kind==='workout'?'strength':w.kind;
function volumeChart(){
 const weeks=Array.from({length:8},(_,i)=>addDay((i-7)*7,monday()));
 const rows=weeks.map(ws=>{const o={};VOL_KINDS.forEach(([k])=>o[k]=0);data.workouts.filter(w=>w.done&&w.date>=ws&&w.date<addDay(7,ws)).forEach(w=>{const k=volKind(w);if(k in o)o[k]+=w.actualMinutes||w.duration||0});return o});
 const totals=rows.map(r=>VOL_KINDS.reduce((s,[k])=>s+r[k],0));
 const maxT=Math.max(60,...totals);const step=maxT>360?120:maxT>180?60:30;const top=Math.ceil(maxT/step)*step;
 const W=340,H=200,L=34,R=8,T=10,B=26,pw=W-L-R,ph=H-T-B;
 const x=i=>L+i*(pw/(weeks.length-1)),y=v=>T+ph-v/top*ph;
 let acc=rows.map(()=>0),layers='',lines='';
 VOL_KINDS.forEach(([k,,c])=>{const lo=acc.slice(),hi=acc.map((a,i)=>a+rows[i][k]);acc=hi;
  const upper=hi.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`),lower=lo.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).reverse();
  layers+=`<polygon points="${upper.concat(lower).join(' ')}" fill="${c}" fill-opacity=".22"/>`;
  lines+=`<polyline points="${upper.join(' ')}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`});
 let grid='';for(let v=0;v<=top;v+=step){grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="vol-grid"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end" class="vol-tick">${v>=60?(v/60)+'h':v+'m'}</text>`}
 const xt=weeks.map((d,i)=>i%2===1||i===weeks.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" class="vol-tick">${i===weeks.length-1?'So far':fmt(d)}</text><line x1="${x(i)}" x2="${x(i)}" y1="${T+ph}" y2="${T+ph+4}" class="vol-axis"/>`:'').join('');
 const last=rows[rows.length-1],sum8=k=>rows.reduce((s,r)=>s+r[k],0);
 const hm=m=>m>=60?Math.floor(m/60)+'h '+(m%60?m%60+'m':''):m+'m';
 return `<section class="section vol-section"><div class="section-head"><h2>Volume by type</h2><span class="count">8 weeks</span></div><p class="section-note">Logged minutes per week, stacked · sample history</p>
 <div class="vol-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Stacked weekly training minutes by type. ${weeks.map((d,i)=>fmt(d)+': '+totals[i]+' minutes').join(', ')}">${grid}<line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" class="vol-axis"/>${layers}${lines}${xt}</svg></div>
 <div class="vol-legend">${VOL_KINDS.map(([k,n,c])=>`<span><i style="background:${c}"></i>${n}<b>${hm(sum8(k)).trim()}</b></span>`).join('')}</div></section>`;
}

 body[data-view="desktop"] #app .cc-page-full[data-pane="calendar"]>section.section:not(#no-date){grid-area:agenda;align-self:stretch;min-width:0;margin:0;padding:18px;background:var(--paper);border:1px solid var(--line);border-radius:18px}

 body[data-view="desktop"] #app .cc-page-full[data-pane="calendar"]>.footnote{grid-area:foot}
}
</style>

\n<style>
.look-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.look-choice{padding:10px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink)}.look-choice[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}.look-swatch{height:44px;border-radius:9px;padding:7px;display:flex;align-items:center;gap:4px;margin-bottom:8px}.look-swatch i{display:block;width:9px;height:9px;border-radius:50%;background:var(--sw-ink)}.look-swatch b{font-size:11px;color:var(--sw-ink)}.look-choice strong{display:block;font-size:11px}.look-choice small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.look-help{font-size:11px;color:var(--muted);line-height:1.5;margin:-5px 0 13px}
</style>
<script>
(()=>{
 const looks=[
  {name:'Clear Blue',font:'SF Pro',f:'-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',bg:'#f3f5f9',paper:'#ffffff',ink:'#172033',muted:'#667085',line:'#e1e6ef',soft:'#e6edfa',accent:'#315fe8'},
  {name:'Ink & Ice',font:'Inter',f:'Inter,Arial,sans-serif',bg:'#eef4f8',paper:'#ffffff',ink:'#142b3b',muted:'#587080',line:'#d5e2e9',soft:'#deedf3',accent:'#087eaa'},
  {name:'Warm Paper',font:'Literata + sans',f:'Georgia,serif',bg:'#f7f3eb',paper:'#fffdf8',ink:'#302a24',muted:'#82786b',line:'#e7ddce',soft:'#efe7d9',accent:'#a45f3f'},
  {name:'Forest',font:'Avenir Next',f:'"Avenir Next",Avenir,Arial,sans-serif',bg:'#f0f4ef',paper:'#fbfdf9',ink:'#1e3025',muted:'#6d7f71',line:'#dce6da',soft:'#e1ebdf',accent:'#39724d'},
  {name:'Graphite',font:'IBM Plex Sans',f:'"IBM Plex Sans",Arial,sans-serif',bg:'#20252b',paper:'#292f36',ink:'#f1f3f5',muted:'#a7b0b9',line:'#3a424b',soft:'#343f48',accent:'#b3d647'},
  {name:'Soft Lilac',font:'Manrope',f:'Manrope,Arial,sans-serif',bg:'#f5f2fb',paper:'#ffffff',ink:'#29243b',muted:'#817994',line:'#e6e0f0',soft:'#eee8f8',accent:'#7455c7'},
  {name:'Terracotta',font:'Georgia + system',f:'Georgia,serif',bg:'#f8f1eb',paper:'#fffaf5',ink:'#382a25',muted:'#8a7065',line:'#eadbd1',soft:'#f1e2d8',accent:'#c05e3d'},
  {name:'Sage Minimal',font:'Helvetica Neue',f:'"Helvetica Neue",Arial,sans-serif',bg:'#f1f4f0',paper:'#fbfcfa',ink:'#27322c',muted:'#79857d',line:'#dfe5df',soft:'#e7eee7',accent:'#5c8069'},
  {name:'Cobalt',font:'Arial',f:'Arial,sans-serif',bg:'#f2f4fb',paper:'#ffffff',ink:'#161b2d',muted:'#6c7286',line:'#dfe3ef',soft:'#e5e9f6',accent:'#354acb'},
  {name:'Slate & Sky',font:'Inter',f:'Inter,Arial,sans-serif',bg:'#edf1f5',paper:'#ffffff',ink:'#202a35',muted:'#687786',line:'#dbe2e9',soft:'#e2eaf1',accent:'#457aa8'}
 ];
 const key='weekline-visual-look-v2';
 function apply(){const app=document.getElementById('app');if(!app)return;let n=Number(localStorage.getItem(key)||1);if(!Number.isInteger(n)||n<0||n>=looks.length)n=0;const t=looks[n];for(const k of ['bg','paper','ink','muted','line','soft','accent'])app.style.setProperty('--'+k,t[k]);app.style.setProperty('--font',t.f);app.style.setProperty('--heading',t.f);app.style.setProperty('--accentInk',n===4?'#17220c':'#ffffff');app.dataset.look=String(n)}
 function picker(){const current=Number(localStorage.getItem(key)||0);sheet('10 visual looks',`<p class="look-help">Each option changes the app-wide colors and typeface. Your layout and controls stay the same. Tap one to apply it.</p><div class="look-grid">${looks.map((x,i)=>`<button class="look-choice" data-action="appearance-pick" data-look="${i}" aria-pressed="${i===current}"><span class="look-swatch" style="background:${x.bg};--sw-ink:${x.ink}"><i style="background:${x.accent}"></i><i style="background:${x.soft}"></i><b style="font-family:${x.f}">Aa</b></span><strong>${String(i+1).padStart(2,'0')} · ${x.name}</strong><small>${x.font}</small></button>`).join('')}</div>`,{kind:'appearance-picker'})}
 const prior=window.render;if(typeof prior==='function')window.render=function(opts){const out=prior(opts);apply();return out};
 document.addEventListener('click',e=>{const b=e.target.closest('[data-action="appearance-options"],[data-action="appearance-pick"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();if(b.dataset.action==='appearance-options'){closeModal();picker()}else{localStorage.setItem(key,b.dataset.look);apply();closeModal()}},true);
 apply();
})();
</script>
