function mosaicHome(v=version,mini=false){return `<div class="overview-tools"><div><span class="eyebrow">${v<3?'Glass Mosaic':'Mosaic Ribbon'} / 0${v%3+1}</span><h1>${['Your day, composed.','Make room for focus.','A clear workspace.','Today at a glance.','Keep things moving.','A little more flow.'][v]}</h1></div>${v===0||v===3?'<button class="round-add" data-act="capture" aria-label="Quick capture">+</button>':''}</div>${[0,2,4].includes(v)?searchButton():''}<div class="mosaic">${T.map(tile).join('')}</div>${[1,3,5].includes(v)?searchButton():''}${v===5?'<form id="quick-task" class="inline-capture"><input name="title" placeholder="Add a to-do for today…" aria-label="Quick task title" required><input type="hidden" name="category" value="Work"><button class="primary">Add →</button></form>':''}` }

function render(){const tt=taskToday();$('#app').dataset.v=version;$('#app').className='app';$('#app').innerHTML=`<header class="app-header"><button class="brand" data-act="nav" data-page="home" aria-label="Home"><span class="mark">W</span><span class="brand-word">Weekline</span></button><button class="header-date" data-act="nav" data-page="calendar" aria-label="Open Calendar"><strong>${fmt(today,{month:'short',day:'numeric'})}</strong><span>${fmt(today,{weekday:'short'})}⌄</span></button><div class="scoreline"><span title="Tasks completed today">${tt.filter(t=>t.done).length}/${tt.length}</span><span title="Workout efficiency">${workoutScore()}%</span><span title="Trailing 7-day habit efficiency">${habitScore()}%</span></div><div class="header-actions"><button class="icon-btn" data-act="search" aria-label="Search everything">⌕</button><button class="icon-btn" data-act="capture" aria-label="Quick capture">+</button><button class="icon-btn backup-btn" data-act="backup" aria-label="Export backup">⇩</button></div></header><div id="page-content">${page==='home'?mosaicHome():({todo:todoView,calendar:calendarView,workouts:workoutsView,notes:notesView,habits:habitsView})[page]()}</div>${navHTML()}`;document.querySelectorAll('button[data-device]').forEach(b=>b.classList.toggle('selected',b.dataset.device===device))}

function taskList(list){return list.length?`<div class="list">${list.map(t=>`<div class="task ${t.done?'done':''}" draggable="true" data-task-id="${t.id}"><button class="check ${t.done?'on':''}" data-act="task-toggle" data-id="${t.id}" aria-label="${t.done?'Reopen':'Complete'} ${esc(t.title)}">${t.done?'✓':''}</button><button class="task-copy" data-act="task-edit" data-id="${t.id}"><b>${esc(t.title)}</b><small>${esc(t.category)}${t.date?' · '+fmt(t.date):' · No date'}${t.time?' · '+t.time:''}${t.repeat!=='none'?' · '+t.repeat:''}</small></button><button class="text-btn" data-act="task-edit" data-id="${t.id}" aria-label="Edit task">↗</button></div>`).join('')}</div>`:'<div class="empty">Nothing here yet. Add a to-do or drag one into this section.</div>'}
function todoView(){let all=data.tasks.filter(t=>!t.done&&(taskFilter==='all'||t.category===taskFilter));return `<form class="quick-form" id="quick-task"><input name="title" aria-label="Quick task title" placeholder="Add a to-do · press Enter" maxlength="160" required><select name="category" aria-label="Category"><option selected>Personal</option><option>Work</option></select></form><div class="filters task-filters">${['all','Work','Personal'].map(f=>`<button data-act="task-filter" data-filter="${f}" class="${taskFilter===f?'on':''}">${f==='all'?'All tasks':f}</button>`).join('')}</div>${[['Today',all.filter(t=>t.date&&t.date<=today),today],['Tomorrow',all.filter(t=>t.date===add(today,1)),add(today,1)],['Later',all.filter(t=>t.date>add(today,1)),add(today,2)],['No date',all.filter(t=>!t.date),'']].map(([title,list,d])=>`<section data-drop-date="${d}"><div class="section-label">${title}<small>${list.length} open</small></div>${taskList(list)}</section>`).join('')}<button class="text-btn" style="margin-top:15px" data-act="done-toggle">${showDone?'Hide':'Show'} completed (${data.tasks.filter(t=>t.done).length})</button>${showDone?taskList(data.tasks.filter(t=>t.done&&(taskFilter==='all'||t.category===taskFilter))):''}`}
function calendarView(){const first=date(month+'-01'),start=(first.getDay()+6)%7,count=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();let cells='<span></span>'.repeat(start);for(let i=1;i<=count;i++){let d=month+'-'+String(i).padStart(2,'0'),marked=data.tasks.some(t=>t.date===d&&!t.done)||data.events.some(e=>e.date===d)||data.workouts.some(w=>w.date===d);cells+=`<button class="cal-day ${d===today?'today':''} ${d===selectedDate?'selected':''}" data-act="cal-day" data-date="${d}" data-drop-date="${d}" aria-pressed="${d===selectedDate}">${i}${marked?'<i></i>':''}</button>`}let items=[...data.events.filter(e=>e.date===selectedDate).map(e=>({...e,type:'event',action:'event-edit'})),...data.tasks.filter(t=>t.date===selectedDate&&!t.done).map(t=>({...t,type:'task',action:'task-edit'})),...data.workouts.filter(w=>w.date===selectedDate).map(w=>({...w,time:w.slot,type:'workout',action:'workout-edit'}))].sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));return heading('Calendar','event-new','Event')+`<div class="calendar-layout"><div class="calendar-panel"><div class="month-head"><button data-act="month-prev" aria-label="Previous month">‹</button><span>${fmt(month+'-01',{month:'long',year:'numeric'})}</span><button data-act="month-next" aria-label="Next month">›</button></div><div class="cal-grid">${['M','T','W','T','F','S','S'].map(d=>`<span class="weekday">${d}</span>`).join('')}${cells}</div><div style="display:flex;justify-content:space-between;margin-top:12px"><button class="text-btn" data-act="cal-today">Today</button><input style="width:auto;padding:6px;font-size:11px" type="date" id="jump-date" value="${selectedDate}" aria-label="Jump to date"></div></div><div class="panel"><div class="section-label" style="margin-top:0">${fmt(selectedDate,{weekday:'long',month:'short',day:'numeric'})}<button class="text-btn" data-act="task-new" data-date="${selectedDate}">+ To-do</button></div>${items.length?items.map(e=>`<div class="agenda-item"><span>${esc(e.time function workoutsView(){let days=Array.from({length:7},(_,i)=>add(week,i)),ws=data.workouts.filter(w=>days.includes(w.date));return heading('Workouts','workout-new','Plan session')+`<div class="week-control"><button data-act="week-prev">←</button><strong>${fmt(week)} – ${fmt(add(week,6))}</strong><button data-act="week-next">→</button></div><div class="stats"><div><b>${ws.reduce((s,w)=>s+Number(w.target),0)}</b><small>Planned minutes</small></div><div><b>${ws.reduce((s,w)=>s+Number(w.actual||0),0)}</b><small>Logged minutes</small></div><div><b>${workoutScore()}%</b><small>Workout efficiency</small></div></div>${days.map(d=>`<section class="workout-day"><h3>${fmt(d,{weekday:'long',month:'short',day:'numeric'})}${d===today?' · Today':''}</h3><div class="slots">${['AM','PM'].map(slot=>`<div class="slot"><div class="slot-label">${slot}</div>${data.workouts.filter(w=>w.date===d&&w.slot===slot).map(w=>`<article class="session"><b>${esc(w.title)}</b><small>${esc(w.kind)} · ${w.target} min${w.actual!==null?' · '+Math.round(Math.min(w.actual/w.target,1)*100)+'%':''}</small><div class="actions"><button data-act="workout-edit" data-id="${w.id}">Edit plan</button><button data-act="workout-log" data-id="${w.id}">${w.actual===null?'Log session':'Edit log'}</button></div></article>`).join('')}<button class="slot-add" data-act="workout-new" data-date="${d}" data-slot="${slot}">+ Add ${slot} session</button></div>`).join('')}</div></section>`).join('')}`}
function folderLastOpened(tab,folder){const times=data.notes.filter(n=>n.tab===tab&&n.folder===folder&&n.lastOpened).map(n=>n.lastOpened).sort();return times.at(-1)||''}

function notesView(){const list=data.notes.filter(n=>n.tab===noteTab&&(noteFolder==='all'||n.folder===noteFolder));return `<div class="notes-controls"><div class="filters">${['Work','Personal','Spanish'].map(t=>`<button class="${noteTab===t?'on':''}" data-act="note-tab" data-tab="${t}">${t}</button>`).join('')}</div><button class="icon-btn" data-act="note-new" aria-label="New note">+</button></div>${noteFolder==='all'?`<div class="notes-grid folder-grid">${folderTiles(noteTab)}</div>`:`<div class="folder-breadcrumb"><button class="text-btn" data-act="note-folder" data-folder="all">← Folders</button><b>${esc(noteFolder)}</b></div><div class="notes-grid compact-notes">${list.map(n=>`<button class="note-card" data-act="note-read" data-id="${n.id}"><b>${esc(n.title)}</b><small>${esc(openedLabel(n.lastOpened))}</small></button>`).join('')}</div>`}${!list.length?'<div class="empty">Nothing here yet. Use + to create a note.</div>':''}`}
function habitsView(){const ds=Array.from({length:7},(_,i)=>add(habitWeek,i));return `<div class="stats"><div><b>${habitScore()}%</b><small>Trailing 7 days</small></div><div><b>${data.habits.filter(h=>h.days.includes(today)).length}/${data.habits.length}</b><small>Completed today</small></div></div><div class="week-control"><button data-act="habit-prev">←</button><strong>${fmt(habitWeek)} – ${fmt(add(habitWeek,6))}</strong><button data-act="habit-next">→</button></div><div class="habit-header"><span>Habit</span>${ds.map(d=>`<span>${fmt(d,{weekday:'narrow'})}<br>${date(d).getDate()}</span>`).join('')}</div>${data.habits.map(h=>`<article class="habit-row"><button class="habit-name" data-act="habit-edit" data-id="${h.id}"><b>${esc(h.title)}</b><small>${esc(h.goal)}</small></button>${ds.map(d=>`<button class="tick ${h.days.includes(d)?'on':''}" data-act="habit-tick" data-id="${h.id}" data-date="${d}" aria-label="${esc(h.title)}, ${fmt(d)}, ${h.days.includes(d)?'complete':'incomplete'}" aria-pressed="${h.days.includes(d)}">${h.days.includes(d)?'✓':'○'}</button>`).join('')}</article>`).join('')}`}
function modal(title,body,{kind='',id='',wide=false,form=true}={}){if(!$('#modal-root').children.length)focusBeforeDialog=document.activeElement;modalKind=kind;recordId=id;editorRange=null;$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="sheet ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-title"><h2>${title}</h2><button class="icon-btn" data-act="close" aria-label="Close">×</button></div>${form?'<form id="editor">':''}${body}${form?'<div class="form-actions">'+(id?`<button class="danger" type="button" data-act="delete">Delete</button>`:'')+'<button class="secondary" type="button" data-act="close">Cancel</button><button class="primary" type="submit">Save</button></div></form>':''}</section></div>`;$('#workspace').inert=true;setTimeout(()=>$('#modal-root input,#modal-root button')?.focus(),0)}

function taskEditor(id='',d){const t=data.tasks.find(t=>t.id===id)||{category:'Personal',date:d??today,repeat:'none'};modal(id?'Edit to-do':'New to-do',field('Title','title',t.title,'text','required maxlength="160"')+`<div class="row2">${select('Category','category',['Work','Personal'],t.category)}${select('Repeat','repeat',['none','daily','weekly'],t.repeat)}</div><div class="row2">${field('Date · optional','date',t.date,'date')}${field('Time · optional','time',t.time,'time')}</div><label for="f-notes">Notes</label><textarea id="f-notes" name="notes">${esc(t.notes||'')}</textarea>`,{kind:'task',id})}

function workoutEditor(id='',d=today,slot='AM'){const w=data.workouts.find(w=>w.id===id)||{date:d,slot,kind:'Run',target:45,effort:4};modal(id?'Edit session':'Plan a session',field('Session','title',w.title,'text','required maxlength="160"')+`<div class="row2">${field('Date','date',w.date,'date','required')}${select('Time of day','slot',['AM','PM'],w.slot)}</div><div class="row2">${select('Type','kind',['Run','Bike','Swim','Strength','Yoga','Other'],w.kind)}${field('Planned minutes','target',w.target,'number','min="1" max="1440" required')}</div>`+field('Planned effort · 1–10','effort',w.effort,'number','min="1" max="10" required'),{kind:'workout',id})}

function noteEditor(id=''){let n=data.notes.find(n=>n.id===id)||{tab:noteTab,folder:noteFolder==='all'?'General':noteFolder};modal(id?'Edit note':'New note',`<label for="note-title">Title</label><input id="note-title" name="title" required maxlength="160" value="${esc(n.title||'')}"><div class="row2">${select('Notebook','tab',['Work','Personal','Spanish'],n.tab)}<div><label for="note-folder">Folder · choose or type a new one</label><input id="note-folder" name="folder" list="note-folders" value="${esc(n.folder)}" required maxlength="60"><datalist id="note-folders">${[...new Set(data.notes.map(x=>x.folder))].map(f=>`<option value="${esc(f)}">`).join('')}</datalist></div></div><label>Note content</label><div class="toolbar" role="toolbar" aria-label="Note formatting">${[['bold','B'],['italic','I'],['underline','U'],['formatBlock','Heading'],['insertUnorderedList','• List'],['insertOrderedList','1. List']].map(([c,t])=>`<button type="button" data-format="${c}">${t}</button>`).join('')}<button type="button" data-act="note-image">+ Image</button><input type="file" id="image-file" accept="image/*" hidden></div><div id="rich-body" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Note content">${clean(n.body||'')}</div><small style="display:block;margin-top:8px;font-size:10px">Paste images directly into your note. Images and formatting are saved with it.</small>`,{kind:'note',id,wide:true});}

function searchResults(q){let a=[...data.tasks.map(x=>({...x,kind:'To-do',act:'task-edit'})),...data.events.map(x=>({...x,kind:'Calendar',act:'event-edit'})),...data.workouts.map(x=>({...x,kind:'Workout',act:'workout-edit'})),...data.notes.map(x=>({...x,kind:'Note',act:'note-read'})),...data.habits.map(x=>({...x,kind:'Habit',act:'habit-edit'}))].filter(x=>(x.title+' '+plain(x.body||'')+' '+(x.notes||'')).toLowerCase().includes(q.toLowerCase()));$('#search-results').innerHTML=q?(a.length?a.map(x=>`<button class="search-result" data-act="${x.act}" data-id="${x.id}"><b>${esc(x.title)}</b><small>${x.kind}${x.date?' · '+fmt(x.date):''}</small></button>`).join(''):'<div class="empty">No matches found.</div>'):''}

function toggleTask(id){const t=data.tasks.find(t=>t.id===id);t.done=!t.done;if(t.done&&t.repeat!=='none'){const due=add(t.date||today,t.repeat==='daily'?1:7);if(!data.tasks.some(x=>x.source===t.id&&x.date===due))data.tasks.push({...t,id:uid(),done:false,date:due,source:t.id})}changed(t.done?'Task completed.':'Task reopened.')}

function shiftMonth(n){let d=date(month+'-01');d.setMonth(d.getMonth()+n);month=day(d).slice(0,7);render()}
document.addEventListener('click',e=>{const format=e.target.closest('[data-format]');if(format){e.preventDefault();$('#rich-body').focus();if(editorRange){let sel=getSelection();sel.removeAllRanges();sel.addRange(editorRange)}document.execCommand(format.dataset.format,false,format.dataset.format==='formatBlock'?'h2':null);return}const dev=e.target.closest('button[data-device]');if(dev){device=dev.dataset.device;document.body.dataset.device=device;render();return}const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;switch(a){case'choose':device=b.dataset.mode||device;document.body.dataset.device=device;choose(Number(b.dataset.v));break;case'previous':choose(version-1);break;case'next':choose(version+1);break;case'nav':if(b.dataset.page==='notes')noteFolder='all';go(b.dataset.page);break;case'capture':capture();break;case'search':search();break;case'backup':exportBackup();break;case'close':close();break;case'delete':deleteRecord();break;case'task-new':taskEditor('',b.dataset.date);break;case'task-edit':taskEditor(id);break;case'task-toggle':toggleTask(id);break;case'task-filter':taskFilter=b.dataset.filter;render();break;case'done-toggle':showDone=!showDone;render();break;case'event-new':eventEditor();break;case'event-edit':eventEditor(id);break;case'month-prev':shiftMonth(-1);break;case'month-next':shiftMonth(1);break;case'cal-day':selectedDate=b.dataset.date;render();break;case'cal-today':selectedDate=today;month=today.slice(0,7);render();break;case'week-prev':week=add(week,-7);render();break;case'week-next':week=add(week,7);render();break;case'workout-new':workoutEditor('',b.dataset.date||today,b.dataset.slot||'AM');break;case'workout-edit':workoutEditor(id);break;case'workout-log':workoutLog(id);break;case'note-new':noteEditor();break;case'note-edit':noteEditor(id);break;case'note-read':noteRead(id);break;case'note-tab':noteTab=b.dataset.tab;noteFolder='all';render();break;case'folder-open':noteTab=b.dataset.tab;noteFolder=b.dataset.folder;{const stamp=new Date().toISOString();data.notes.filter(n=>n.tab===noteTab&&n.folder===noteFolder).forEach(n=>n.lastOpened=stamp);save();}go('notes');break;case'note-folder':noteFolder=b.dataset.folder;render();break;case'note-image':$('#image-file').click();break;case'habit-new':habitEditor();break;case'habit-edit':habitEditor(id);break;case'habit-prev':habitWeek=add(habitWeek,-7);render();break;case'habit-next':habitWeek=add(habitWeek,7);render();break;case'habit-tick':{let h=data.habits.find(h=>h.id===id),d=b.dataset.date;h.days=h.days.includes(d)?h.days.filter(x=>x!==d):[...h.days,d];changed('Habit updated.');break}}});
document.addEventListener('submit',e=>{if(e.target.id==='quick-task'){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(!v.title.trim())return;data.tasks.push({id:uid(),title:v.title.trim(),category:v.category,date:today,time:'',done:false,repeat:'none',notes:''});changed('Task added.');return}if(e.target.id!=='editor')return;e.preventDefault();let v=Object.fromEntries(new FormData(e.target)),id=recordId||uid(),key=({task:'tasks',event:'events',workout:'workouts',log:'workouts',note:'notes',habit:'habits'})[modalKind],old=data[key]?.find(x=>x.id===id);if(!key)return;let next={...old,...v,id};if(v.title!==undefined){next.title=v.title.trim();if(!next.title){notify('Enter a title.');return}}if(modalKind==='task'){next.done=old?.done||false;if(!next.date)next.time=''}if(modalKind==='event'){if(next.end&&next.time&&next.end<next.time){notify('End time must be at or after start time.');return}if(!next.time)next.end=''}if(modalKind==='workout'){next.target=Number(v.target);next.effort=Number(v.effort);next.actual=old?.actual??null;next.notes=old?.notes||''}if(modalKind==='log')next={...old,actual:Number(v.actual),actualEffort:Number(v.effort),notes:v.notes};if(modalKind==='habit')next.days=old?.days||[];if(modalKind==='note'){next.body=clean($('#rich-body').innerHTML);next.folder=v.folder.trim()||'General';next.entered=old?.entered||new Date().toISOString();next.updated=new Date().toISOString();noteTab=next.tab;noteFolder=next.folder;next.lastOpened=new Date().toISOString()}let snapshot=JSON.stringify(data);if(old)data[key][data[key].findIndex(x=>x.id===id)]=next;else data[key].unshift(next);if(!save()){data=JSON.parse(snapshot);return}forceClose();render();gallery();notify('Saved.');});
document.addEventListener('input',e=>{if(e.target.id==='global-search')searchResults(e.target.value);if(e.target.name==='actual'&&modalKind==='log'){let w=data.workouts.find(w=>w.id===recordId);$('#live-score').textContent=Math.round(Math.min(Number(e.target.value)/w.target,1)*100)+'%'}});
document.addEventListener('change',e=>{if(e.target.id==='version-select')choose(Number(e.target.value));if(e.target.id==='jump-date'&&e.target.value){selectedDate=e.target.value;month=selectedDate.slice(0,7);render()}if(e.target.id==='image-file')for(const f of e.target.files)insertImage(f)});
function insertImage(file){if(!file.type.startsWith('image/'))return;if(file.size>3*1024*1024){notify('Use an image smaller than 3 MB.');return}const r=new FileReader();r.onload=()=>{const ed=$('#rich-body');if(!ed)return;ed.focus();if(editorRange&&ed.contains(editorRange.commonAncestorContainer)){let s=getSelection();s.removeAllRanges();s.addRange(editorRange)}document.execCommand('insertHTML',false,'<p><img src="'+r.result+'" alt="Note image"></p><p><br></p>')};r.readAsDataURL(file)}
document.addEventListener('paste',e=>{if(!e.target.closest('#rich-body'))return;const pics=[...e.clipboardData.items].filter(i=>i.type.startsWith('image/'));if(pics.length){e.preventDefault();pics.forEach(i=>insertImage(i.getAsFile()))}else{const h=e.clipboardData.getData('text/html');if(h){e.preventDefault();document.execCommand('insertHTML',false,clean(h))}}});
document.addEventListener('selectionchange',()=>{let s=getSelection(),ed=$('#rich-body');if(ed&&s.rangeCount&&ed.contains(s.anchorNode))editorRange=s.getRangeAt(0).cloneRange()});
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-format]'))e.preventDefault()});
let dragged='';document.addEventListener('dragstart',e=>{let t=e.target.closest('[data-task-id]');if(t){dragged=t.dataset.taskId;e.dataTransfer.setData('text/plain',dragged)}});document.addEventListener('dragover',e=>{if(e.target.closest('[data-drop-date]'))e.preventDefault()});document.addEventListener('drop',e=>{let el=e.target.closest('[data-drop-date]');if(!el)return;e.preventDefault();let id=e.dataTransfer.getData('text/plain')||dragged,t=data.tasks.find(t=>t.id===id);if(t){t.date=el.dataset.dropDate;if(!t.date)t.time='';changed(t.date?'Moved to '+fmt(t.date):'Date cleared.')}});
document.addEventListener('keydown',e=>{if(e.key==='Tab'&&$('#modal-root').children.length){const items=[...$('#modal-root').querySelectorAll('button,input,select,textarea,[contenteditable=true]')].filter(el=>!el.hidden&&el.type!=='hidden');const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}if(e.target.matches('.preview-open')&&['Enter',' '].includes(e.key)){e.preventDefault();choose(Number(e.target.dataset.v));return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search()}if(e.key==='Escape'&&$('#modal-root').children.length)close()});
document.body.dataset.device=device;choose();matchMedia('(max-width:699px)').addEventListener('change',e=>{device=e.matches?'mobile':'desktop';document.body.dataset.device=device;});
</script></body></html>
